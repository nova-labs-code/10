<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Colored Binary GIF / WebP to GIF</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #121212;
    color: #e0e0e0;
    padding: 20px;
    max-width: 1400px;
    margin: auto;
}

h2 {
    color: #4fc3f7;
    margin-top: 0;
}

.controls {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
}

input[type="text"] {
    flex: 1;
    padding: 10px;
    border-radius: 4px;
    border: 1px solid #333;
    background: #1e1e1e;
    color: white;
    min-width: 280px;
    outline: none;
    font-size: 14px;
}

input[type="text"]:focus {
    border-color: #0288d1;
}

input[type="file"] {
    color: #ddd;
    max-width: 300px;
}

select,
button {
    padding: 10px 15px;
    border-radius: 4px;
    border: none;
    background: #0288d1;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

select {
    min-width: 230px;
}

button:hover {
    background: #0277bd;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#stopBtn {
    display: none;
    background: #c62828;
}

#stopBtn:hover {
    background: #b71c1c;
}

#downloadBtn {
    display: none;
    background: #2e7d32;
}

#downloadBtn:hover {
    background: #1b5e20;
}

#copyBtn {
    display: none;
    background: #6a1b9a;
}

#info {
    color: #aaa;
    font-size: 13px;
    margin: 8px 0 12px;
    line-height: 1.5;
}

#warning {
    display: none;
    background: #4a3200;
    border: 1px solid #9a6b00;
    color: #ffd666;
    padding: 10px;
    border-radius: 5px;
    margin-bottom: 12px;
    line-height: 1.4;
}

#error {
    display: none;
    background: #4a1010;
    border: 1px solid #a52a2a;
    color: #ffaaaa;
    padding: 10px;
    border-radius: 5px;
    margin-bottom: 12px;
    line-height: 1.4;
}

#progressContainer {
    display: none;
    width: 100%;
    height: 7px;
    background: #222;
    border-radius: 4px;
    margin-bottom: 12px;
    overflow: hidden;
}

#progressBar {
    height: 100%;
    width: 0%;
    background: #03a9f4;
    transition: width .05s linear;
}

#outputWrapper {
    background: #000;
    border: 1px solid #333;
    border-radius: 6px;
    overflow: auto;
    padding: 15px;
    max-width: 100%;
}

#canvasContainer {
    width: 100%;
    overflow: hidden;
    background: #000;
}

#previewCanvas {
    display: block;
    background: #000;
    image-rendering: auto;
    max-width: none;
}

#placeholder {
    color: #777;
    font-family: "Courier New", monospace;
    white-space: pre-wrap;
}

#downloadArea {
    margin-top: 15px;
    display: none;
}

#gifPreview {
    max-width: 100%;
    height: auto;
    background: #000;
    border: 1px solid #333;
}

#sourceCanvas,
#frameCanvas {
    display: none;
}

.small {
    color: #888;
    font-size: 12px;
    margin-top: 8px;
}
</style>
</head>

<body>

<h2>Image → Colored 1 / 0 Animated GIF</h2>

<div class="controls">

    <input
        type="text"
        id="imgUrl"
        placeholder="Paste image / GIF / WebP URL..."
    >

    <input
        type="file"
        id="fileInput"
        accept="image/*,.gif,.webp"
    >

    <select id="qualitySelect">
        <option value="35">
            Low — 35 characters wide
        </option>

        <option value="80" selected>
            Medium — 80 characters wide
        </option>

        <option value="150">
            High — 150 characters wide
        </option>

        <option value="300">
            Ultra — 300 characters wide
        </option>

        <option value="600">
            Extreme — 600 characters wide
        </option>

        <option value="1200">
            ⚡ HYPER — 1200 characters wide
        </option>
    </select>

    <button id="convertBtn">Convert</button>
    <button id="stopBtn">Stop</button>
    <button id="downloadBtn">Download GIF</button>
    <button id="copyBtn">Copy Frame</button>

</div>

<div id="info">
    No image loaded.
</div>

<div id="warning"></div>

<div id="error"></div>

<div id="progressContainer">
    <div id="progressBar"></div>
</div>

<div id="outputWrapper">

    <div id="canvasContainer">

        <div id="placeholder">
            Paste an image/GIF/WebP URL or choose a file above.
        </div>

        <canvas id="previewCanvas"></canvas>

    </div>

</div>

<div id="downloadArea">

    <h3>Generated GIF</h3>

    <img id="gifPreview">

    <div class="small">
        The GIF above is the actual generated binary GIF.
    </div>

</div>

<canvas id="sourceCanvas"></canvas>
<canvas id="frameCanvas"></canvas>


<script>
"use strict";


/* =========================================================
   CONFIG
   ========================================================= */

const CHAR_WIDTH = 6;
const CHAR_HEIGHT = 10;
const FONT_SIZE = 10;

const MAX_ANIMATION_FRAMES = 200;

const ANIMATED_MAX_WIDTH = 800;
const ANIMATED_MAX_HEIGHT = 150;

const MAX_OUTPUT_PIXELS = 160000000;


/* =========================================================
   ELEMENTS
   ========================================================= */

const imgUrl = document.getElementById("imgUrl");
const fileInput = document.getElementById("fileInput");
const qualitySelect = document.getElementById("qualitySelect");

const convertBtn = document.getElementById("convertBtn");
const stopBtn = document.getElementById("stopBtn");
const downloadBtn = document.getElementById("downloadBtn");
const copyBtn = document.getElementById("copyBtn");

const info = document.getElementById("info");
const warning = document.getElementById("warning");
const errorBox = document.getElementById("error");

const progressContainer =
    document.getElementById("progressContainer");

const progressBar =
    document.getElementById("progressBar");

const outputWrapper =
    document.getElementById("outputWrapper");

const previewCanvas =
    document.getElementById("previewCanvas");

const canvasContainer =
    document.getElementById("canvasContainer");

const placeholder =
    document.getElementById("placeholder");

const gifPreview =
    document.getElementById("gifPreview");

const downloadArea =
    document.getElementById("downloadArea");

const sourceCanvas =
    document.getElementById("sourceCanvas");

const frameCanvas =
    document.getElementById("frameCanvas");


/* =========================================================
   STATE
   ========================================================= */

let renderToken = 0;

let currentGifBlob = null;
let currentGifUrl = null;

let currentImageData = null;

let currentWidth = 0;
let currentHeight = 0;


/* =========================================================
   HELPERS
   ========================================================= */

function nextFrame() {
    return new Promise(resolve => requestAnimationFrame(resolve));
}


function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}


function setInfo(text) {
    info.textContent = text;
}


function showError(text) {
    errorBox.textContent = text;
    errorBox.style.display = "block";
}


function hideError() {
    errorBox.style.display = "none";
    errorBox.textContent = "";
}


function showWarning(text) {
    warning.textContent = text;
    warning.style.display = "block";
}


function hideWarning() {
    warning.style.display = "none";
    warning.textContent = "";
}


function showProgress(percent) {
    progressContainer.style.display = "block";
    progressBar.style.width =
        clamp(percent, 0, 100) + "%";
}


function hideProgress() {
    progressContainer.style.display = "none";
    progressBar.style.width = "0%";
}


function clearOutput() {

    previewCanvas.width = 1;
    previewCanvas.height = 1;

    previewCanvas.style.width = "1px";
    previewCanvas.style.height = "1px";

    placeholder.style.display = "block";
}


function fitCanvasToScreen() {

    if (
        previewCanvas.width <= 1 ||
        previewCanvas.height <= 1
    ) {
        return;
    }

    const availableWidth =
        Math.max(
            1,
            outputWrapper.clientWidth - 30
        );

    const naturalWidth =
        previewCanvas.width;

    let scale =
        Math.min(
            1,
            availableWidth / naturalWidth
        );

    previewCanvas.style.width =
        Math.round(
            naturalWidth * scale
        ) + "px";

    previewCanvas.style.height =
        Math.round(
            previewCanvas.height * scale
        ) + "px";
}


/* =========================================================
   RESOLUTION
   ========================================================= */

function calculateResolution(
    sourceWidth,
    sourceHeight,
    quality,
    animated
) {

    let width;

    if (animated) {

        width =
            Math.min(
                sourceWidth,
                ANIMATED_MAX_WIDTH
            );

    } else {

        width =
            Math.min(
                parseInt(quality, 10),
                sourceWidth
            );
    }

    const imageRatio =
        sourceHeight / sourceWidth;

    const characterCorrection =
        CHAR_WIDTH / CHAR_HEIGHT;

    let height =
        Math.max(
            1,
            Math.round(
                width *
                imageRatio *
                characterCorrection
            )
        );

    if (animated) {

        if (
            height > ANIMATED_MAX_HEIGHT
        ) {

            const scale =
                ANIMATED_MAX_HEIGHT /
                height;

            height =
                ANIMATED_MAX_HEIGHT;

            width =
                Math.max(
                    1,
                    Math.round(width * scale)
                );
        }
    }

    return {
        width,
        height
    };
}


/* =========================================================
   MIME DETECTION
   ========================================================= */

function guessMime(name) {

    const clean =
        name
            .split("?")[0]
            .split("#")[0]
            .toLowerCase();

    if (clean.endsWith(".gif")) {
        return "image/gif";
    }

    if (clean.endsWith(".webp")) {
        return "image/webp";
    }

    if (clean.endsWith(".png")) {
        return "image/png";
    }

    if (
        clean.endsWith(".jpg") ||
        clean.endsWith(".jpeg")
    ) {
        return "image/jpeg";
    }

    if (clean.endsWith(".bmp")) {
        return "image/bmp";
    }

    return "";
}


/* =========================================================
   GET INPUT
   ========================================================= */

async function getInputSource() {

    const file =
        fileInput.files[0];

    if (file) {

        return {
            blob: file,
            mime:
                file.type ||
                guessMime(file.name)
        };
    }

    const url =
        imgUrl.value.trim();

    if (!url) {
        throw new Error(
            "Please provide an image URL or choose a file."
        );
    }

    const response =
        await fetch(
            url,
            {
                mode: "cors"
            }
        );

    if (!response.ok) {
        throw new Error(
            "Could not download image. HTTP " +
            response.status
        );
    }

    const blob =
        await response.blob();

    return {
        blob,
        mime:
            blob.type ||
            guessMime(url)
    };
}


/* =========================================================
   GIF BINARY DECODER
   =========================================================
   
   This is a small GIF89a/87a decoder.

   It supports:
   - animated GIF
   - GIF transparency
   - GIF disposal methods
   - local/global palettes
   - interlacing
   - frame delays

   It does NOT depend on WebCodecs.
   ========================================================= */

function readUInt16(data, pos) {
    return data[pos] | (data[pos + 1] << 8);
}


function readSubBlocks(data, pos) {

    const chunks = [];

    while (pos < data.length) {

        const size = data[pos++];

        if (size === 0) {
            break;
        }

        chunks.push(
            data.subarray(pos, pos + size)
        );

        pos += size;
    }

    let total = 0;

    for (const c of chunks) {
        total += c.length;
    }

    const result =
        new Uint8Array(total);

    let offset = 0;

    for (const c of chunks) {
        result.set(c, offset);
        offset += c.length;
    }

    return {
        data: result,
        pos
    };
}


/* ---------------------------------------------------------
   GIF LZW
   --------------------------------------------------------- */

function decodeLZW(
    compressed,
    minCodeSize,
    expectedSize
) {

    const clearCode =
        1 << minCodeSize;

    const endCode =
        clearCode + 1;

    let codeSize =
        minCodeSize + 1;

    let nextCode =
        endCode + 1;

    const dictionary =
        new Array(4096);

    let bitPosition = 0;

    function readCode() {

        let code = 0;

        for (
            let i = 0;
            i < codeSize;
            i++
        ) {

            const byteIndex =
                bitPosition >> 3;

            const bitIndex =
                bitPosition & 7;

            if (
                byteIndex >=
                compressed.length
            ) {
                return null;
            }

            if (
                compressed[byteIndex] &
                (1 << bitIndex)
            ) {
                code |= 1 << i;
            }

            bitPosition++;
        }

        return code;
    }

    function resetDictionary() {

        for (
            let i = 0;
            i < clearCode;
            i++
        ) {
            dictionary[i] = [i];
        }

        codeSize =
            minCodeSize + 1;

        nextCode =
            endCode + 1;
    }

    resetDictionary();

    const output =
        new Uint8Array(expectedSize);

    let outputPos = 0;

    let previous = null;

    while (
        outputPos < expectedSize
    ) {

        const code =
            readCode();

        if (code === null) {
            break;
        }

        if (code === clearCode) {

            resetDictionary();

            previous = null;

            continue;
        }

        if (code === endCode) {
            break;
        }

        let entry;

        if (
            code < nextCode &&
            dictionary[code]
        ) {

            entry =
                dictionary[code];

        } else if (
            code === nextCode &&
            previous
        ) {

            entry =
                previous.concat(
                    previous[0]
                );

        } else {

            throw new Error(
                "Invalid GIF LZW data."
            );
        }

        for (
            let i = 0;
            i < entry.length &&
            outputPos < expectedSize;
            i++
        ) {

            output[outputPos++] =
                entry[i];
        }

        if (previous) {

            dictionary[nextCode++] =
                previous.concat(
                    entry[0]
                );

            if (
                nextCode ===
                (1 << codeSize)
            ) {

                if (
                    codeSize < 12
                ) {
                    codeSize++;
                }
            }
        }

        previous = entry;
    }

    return output;
}


/* ---------------------------------------------------------
   GIF PALETTE
   --------------------------------------------------------- */

function readPalette(
    data,
    pos,
    size
) {

    const palette =
        new Uint8Array(
            size * 3
        );

    const bytes =
        size * 3;

    if (
        pos + bytes >
        data.length
    ) {
        throw new Error(
            "Invalid GIF color table."
        );
    }

    palette.set(
        data.subarray(
            pos,
            pos + bytes
        )
    );

    return {
        palette,
        pos: pos + bytes
    };
}


/* ---------------------------------------------------------
   GIF FRAME COMPOSITING
   --------------------------------------------------------- */

function deinterlace(
    pixels,
    width,
    height
) {

    const result =
        new Uint8Array(
            pixels.length
        );

    let sourceRow = 0;

    const passes = [
        [0, 8],
        [4, 8],
        [2, 4],
        [1, 2]
    ];

    for (const [start, step] of passes) {

        for (
            let y = start;
            y < height;
            y += step
        ) {

            const src =
                sourceRow * width;

            const dst =
                y * width;

            result.set(
                pixels.subarray(
                    src,
                    src + width
                ),
                dst
            );

            sourceRow++;
        }
    }

    return result;
}


/* ---------------------------------------------------------
   PARSE GIF
   --------------------------------------------------------- */

async function decodeGIF(
    blob,
    token
) {

    const buffer =
        await blob.arrayBuffer();

    const data =
        new Uint8Array(buffer);

    if (
        data.length < 13
    ) {
        throw new Error(
            "GIF file is too small."
        );
    }

    const signature =
        String.fromCharCode(
            data[0],
            data[1],
            data[2]
        );

    if (
        signature !== "GIF"
    ) {
        throw new Error(
            "Not a valid GIF file."
        );
    }

    const width =
        readUInt16(data, 6);

    const height =
        readUInt16(data, 8);

    if (
        !width ||
        !height
    ) {
        throw new Error(
            "GIF has invalid dimensions."
        );
    }

    const packed =
        data[10];

    const backgroundIndex =
        data[11];

    let pos = 13;

    let globalPalette = null;

    if (
        packed & 0x80
    ) {

        const tableSize =
            2 **
            ((packed & 0x07) + 1);

        const paletteResult =
            readPalette(
                data,
                pos,
                tableSize
            );

        globalPalette =
            paletteResult.palette;

        pos =
            paletteResult.pos;
    }

    const canvasSize =
        width * height;

    let composited =
        new Uint8ClampedArray(
            canvasSize * 4
        );

    composited.fill(0);

    const frames = [];

    let gce = {
        delay: 100,
        transparent: false,
        transparentIndex: 0,
        disposal: 0
    };

    while (
        pos < data.length
    ) {

        if (
            token !== renderToken
        ) {
            throw new Error(
                "Rendering stopped."
            );
        }

        const block =
            data[pos++];

        /* Trailer */
        if (block === 0x3B) {
            break;
        }

        /* Extension */
        if (block === 0x21) {

            if (
                pos >= data.length
            ) {
                break;
            }

            const label =
                data[pos++];

            /* Graphic Control Extension */
            if (
                label === 0xF9
            ) {

                const blockSize =
                    data[pos++];

                if (
                    blockSize !== 4
                ) {
                    throw new Error(
                        "Invalid GIF graphic control extension."
                    );
                }

                const gcePacked =
                    data[pos++];

                const delayCs =
                    readUInt16(
                        data,
                        pos
                    );

                pos += 2;

                const transparentIndex =
                    data[pos++];

                pos++; // block terminator

                gce = {
                    delay:
                        Math.max(
                            20,
                            delayCs * 10
                        ),

                    transparent:
                        !!(
                            gcePacked & 1
                        ),

                    transparentIndex,

                    disposal:
                        (
                            gcePacked >> 2
                        ) & 7
                };

                continue;
            }

            /* Application / comment / plain text */
            while (
                pos < data.length
            ) {

                const size =
                    data[pos++];

                if (
                    size === 0
                ) {
                    break;
                }

                pos += size;
            }

            continue;
        }

        /* Image descriptor */
        if (
            block === 0x2C
        ) {

            if (
                pos + 9 >
                data.length
            ) {
                throw new Error(
                    "Invalid GIF image descriptor."
                );
            }

            const left =
                readUInt16(
                    data,
                    pos
                );

            const top =
                readUInt16(
                    data,
                    pos + 2
                );

            const frameWidth =
                readUInt16(
                    data,
                    pos + 4
                );

            const frameHeight =
                readUInt16(
                    data,
                    pos + 6
                );

            const imagePacked =
                data[pos + 8];

            pos += 9;

            let palette =
                globalPalette;

            if (
                imagePacked & 0x80
            ) {

                const tableSize =
                    2 **
                    ((imagePacked & 0x07) + 1);

                const paletteResult =
                    readPalette(
                        data,
                        pos,
                        tableSize
                    );

                palette =
                    paletteResult.palette;

                pos =
                    paletteResult.pos;
            }

            if (!palette) {
                throw new Error(
                    "GIF frame has no color table."
                );
            }

            const minCodeSize =
                data[pos++];

            const blockResult =
                readSubBlocks(
                    data,
                    pos
                );

            const compressed =
                blockResult.data;

            pos =
                blockResult.pos;

            const pixelCount =
                frameWidth *
                frameHeight;

            let indices =
                decodeLZW(
                    compressed,
                    minCodeSize,
                    pixelCount
                );

            if (
                imagePacked & 0x40
            ) {

                indices =
                    deinterlace(
                        indices,
                        frameWidth,
                        frameHeight
                    );
            }

            /*
             * Save previous canvas when disposal=3.
             */
            let previousCanvas = null;

            if (
                gce.disposal === 3
            ) {

                previousCanvas =
                    new Uint8ClampedArray(
                        composited
                    );
            }

            /*
             * Draw frame onto composited canvas.
             */
            for (
                let y = 0;
                y < frameHeight;
                y++
            ) {

                const destY =
                    top + y;

                if (
                    destY < 0 ||
                    destY >= height
                ) {
                    continue;
                }

                for (
                    let x = 0;
                    x < frameWidth;
                    x++
                ) {

                    const destX =
                        left + x;

                    if (
                        destX < 0 ||
                        destX >= width
                    ) {
                        continue;
                    }

                    const sourceIndex =
                        indices[
                            y * frameWidth + x
                        ];

                    if (
                        gce.transparent &&
                        sourceIndex ===
                        gce.transparentIndex
                    ) {
                        continue;
                    }

                    const paletteIndex =
                        sourceIndex * 3;

                    if (
                        paletteIndex + 2 >=
                        palette.length
                    ) {
                        continue;
                    }

                    const destIndex =
                        (
                            destY * width +
                            destX
                        ) * 4;

                    composited[destIndex] =
                        palette[paletteIndex];

                    composited[destIndex + 1] =
                        palette[paletteIndex + 1];

                    composited[destIndex + 2] =
                        palette[paletteIndex + 2];

                    composited[destIndex + 3] =
                        255;
                }
            }

            /*
             * Copy complete composited frame.
             */
            frames.push({
                pixels:
                    new Uint8ClampedArray(
                        composited
                    ),

                delay:
                    gce.delay
            });

            /*
             * Disposal.
             */
            if (
                gce.disposal === 2
            ) {

                for (
                    let y = 0;
                    y < frameHeight;
                    y++
                ) {

                    const destY =
                        top + y;

                    if (
                        destY < 0 ||
                        destY >= height
                    ) {
                        continue;
                    }

                    for (
                        let x = 0;
                        x < frameWidth;
                        x++
                    ) {

                        const destX =
                            left + x;

                        if (
                            destX < 0 ||
                            destX >= width
                        ) {
                            continue;
                        }

                        const index =
                            (
                                destY * width +
                                destX
                            ) * 4;

                        composited[index] = 0;
                        composited[index + 1] = 0;
                        composited[index + 2] = 0;
                        composited[index + 3] = 0;
                    }
                }

            } else if (
                gce.disposal === 3 &&
                previousCanvas
            ) {

                composited =
                    previousCanvas;
            }

            gce = {
                delay: 100,
                transparent: false,
                transparentIndex: 0,
                disposal: 0
            };

            if (
                frames.length >=
                MAX_ANIMATION_FRAMES
            ) {

                showWarning(
                    `GIF contains more than ` +
                    `${MAX_ANIMATION_FRAMES} frames. ` +
                    `Only the first ` +
                    `${MAX_ANIMATION_FRAMES} frames will be converted.`
                );

                break;
            }

            await nextFrame();
        }
    }

    if (
        !frames.length
    ) {
        throw new Error(
            "No image frames were found in the GIF."
        );
    }

    return {
        width,
        height,
        frames
    };
}


/* =========================================================
   IMAGE DATA → BINARY CANVAS
   ========================================================= */

function renderBinaryFrame(
    imageData,
    asciiWidth,
    asciiHeight,
    token
) {

    const outputWidth =
        asciiWidth * CHAR_WIDTH;

    const outputHeight =
        asciiHeight * CHAR_HEIGHT;

    previewCanvas.width =
        outputWidth;

    previewCanvas.height =
        outputHeight;

    const ctx =
        previewCanvas.getContext("2d");

    ctx.fillStyle = "#000000";

    ctx.fillRect(
        0,
        0,
        outputWidth,
        outputHeight
    );

    ctx.font =
        `${FONT_SIZE}px "Courier New", monospace`;

    ctx.textBaseline = "top";

    for (
        let y = 0;
        y < asciiHeight;
        y++
    ) {

        if (
            token !== renderToken
        ) {
            return false;
        }

        for (
            let x = 0;
            x < asciiWidth;
            x++
        ) {

            const index =
                (
                    y * asciiWidth + x
                ) * 4;

            const r =
                imageData.data[index];

            const g =
                imageData.data[index + 1];

            const b =
                imageData.data[index + 2];

            const alpha =
                imageData.data[index + 3];

            /*
             * ONLY fully transparent pixels
             * become blank.
             */
            if (
                alpha === 0
            ) {
                continue;
            }

            const gray =
                0.299 * r +
                0.587 * g +
                0.114 * b;

            const char =
                gray < 128 ? "1" : "0";

            ctx.fillStyle =
                `rgba(${r},${g},${b},${alpha / 255})`;

            ctx.fillText(
                char,
                x * CHAR_WIDTH,
                y * CHAR_HEIGHT
            );
        }
    }

    return true;
}


/* =========================================================
   GIF FRAME → ASCII IMAGE DATA
   ========================================================= */

function gifFrameToImageData(
    frame,
    sourceWidth,
    sourceHeight,
    asciiWidth,
    asciiHeight
) {

    frameCanvas.width =
        asciiWidth;

    frameCanvas.height =
        asciiHeight;

    const ctx =
        frameCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );

    const tempCanvas =
        document.createElement("canvas");

    tempCanvas.width =
        sourceWidth;

    tempCanvas.height =
        sourceHeight;

    const tempCtx =
        tempCanvas.getContext("2d");

    const sourceImageData =
        new ImageData(
            frame.pixels,
            sourceWidth,
            sourceHeight
        );

    tempCtx.putImageData(
        sourceImageData,
        0,
        0
    );

    ctx.clearRect(
        0,
        0,
        asciiWidth,
        asciiHeight
    );

    ctx.drawImage(
        tempCanvas,
        0,
        0,
        asciiWidth,
        asciiHeight
    );

    return ctx.getImageData(
        0,
        0,
        asciiWidth,
        asciiHeight
    );
}


/* =========================================================
   STATIC IMAGE
   ========================================================= */

async function decodeStatic(
    blob,
    token
) {

    const bitmap =
        await createImageBitmap(blob);

    if (
        token !== renderToken
    ) {

        bitmap.close();

        return null;
    }

    const sourceWidth =
        bitmap.width;

    const sourceHeight =
        bitmap.height;

    const resolution =
        calculateResolution(
            sourceWidth,
            sourceHeight,
            qualitySelect.value,
            false
        );

    const asciiWidth =
        resolution.width;

    const asciiHeight =
        resolution.height;

    const pixels =
        asciiWidth *
        CHAR_WIDTH *
        asciiHeight *
        CHAR_HEIGHT;

    if (
        pixels >
        MAX_OUTPUT_PIXELS
    ) {

        bitmap.close();

        throw new Error(
            "Requested resolution is too large."
        );
    }

    sourceCanvas.width =
        asciiWidth;

    sourceCanvas.height =
        asciiHeight;

    const ctx =
        sourceCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );

    ctx.clearRect(
        0,
        0,
        asciiWidth,
        asciiHeight
    );

    ctx.drawImage(
        bitmap,
        0,
        0,
        asciiWidth,
        asciiHeight
    );

    bitmap.close();

    const imageData =
        ctx.getImageData(
            0,
            0,
            asciiWidth,
            asciiHeight
        );

    currentImageData =
        imageData;

    currentWidth =
        asciiWidth;

    currentHeight =
        asciiHeight;

    placeholder.style.display =
        "none";

    const success =
        renderBinaryFrame(
            imageData,
            asciiWidth,
            asciiHeight,
            token
        );

    if (!success) {
        return null;
    }

    fitCanvasToScreen();

    return {
        width: asciiWidth,
        height: asciiHeight
    };
}


/* =========================================================
   GIF ENCODER
   =========================================================
   
   Pure JavaScript GIF encoder.
   
   No worker.
   No external library.
   No server.
   ========================================================= */


/* ---------------------------------------------------------
   Bit writer
   --------------------------------------------------------- */

class BitWriter {

    constructor() {
        this.bytes = [];
        this.current = 0;
        this.bits = 0;
    }

    write(value, count) {

        while (count > 0) {

            const free =
                8 - this.bits;

            const take =
                Math.min(
                    free,
                    count
                );

            const mask =
                (1 << take) - 1;

            this.current |=
                (value & mask) <<
                this.bits;

            value >>=
                take;

            count -=
                take;

            this.bits +=
                take;

            if (
                this.bits === 8
            ) {

                this.bytes.push(
                    this.current
                );

                this.current = 0;
                this.bits = 0;
            }
        }
    }

    finish() {

        if (
            this.bits > 0
        ) {

            this.bytes.push(
                this.current
            );
        }

        return new Uint8Array(
            this.bytes
        );
    }
}


/* ---------------------------------------------------------
   GIF LZW encoder
   --------------------------------------------------------- */

function encodeLZW(
    indices,
    minCodeSize
) {

    const clearCode =
        1 << minCodeSize;

    const endCode =
        clearCode + 1;

    let codeSize =
        minCodeSize + 1;

    let nextCode =
        endCode + 1;

    const dictionary =
        new Map();

    const writer =
        new BitWriter();

    function reset() {

        dictionary.clear();

        codeSize =
            minCodeSize + 1;

        nextCode =
            endCode + 1;
    }

    function writeCode(code) {

        writer.write(
            code,
            codeSize
        );
    }

    reset();

    writeCode(clearCode);

    if (
        indices.length === 0
    ) {

        writeCode(endCode);

        return writer.finish();
    }

    let prefix =
        indices[0];

    for (
        let i = 1;
        i < indices.length;
        i++
    ) {

        const value =
            indices[i];

        const key =
            prefix + "," + value;

        if (
            dictionary.has(key)
        ) {

            prefix =
                dictionary.get(key);

            continue;
        }

        writeCode(prefix);

        if (
            nextCode < 4096
        ) {

            dictionary.set(
                key,
                nextCode++
            );

            if (
                nextCode ===
                (1 << codeSize)
            ) {

                if (
                    codeSize < 12
                ) {
                    codeSize++;
                }
            }

        } else {

            writeCode(clearCode);

            reset();
        }

        prefix =
            value;
    }

    writeCode(prefix);
    writeCode(endCode);

    return writer.finish();
}


/* ---------------------------------------------------------
   Byte utilities
   --------------------------------------------------------- */

function push16(array, value) {

    array.push(
        value & 255,
        (value >> 8) & 255
    );
}


function pushBytes(
    array,
    bytes
) {

    for (
        let i = 0;
        i < bytes.length;
        i++
    ) {
        array.push(bytes[i]);
    }
}


/* ---------------------------------------------------------
   Convert RGB → palette index
   --------------------------------------------------------- */

function buildPalette(
    imageData
) {

    /*
     * Binary art only needs:
     *
     * 0 = black
     * 1 = white
     *
     * But colored output requires colors.
     *
     * We quantize the source colors to a
     * 256-color palette using a fast histogram.
     */

    const pixels =
        imageData.data;

    const colorMap =
        new Map();

    const colors = [];

    for (
        let i = 0;
        i < pixels.length;
        i += 4
    ) {

        if (
            pixels[i + 3] === 0
        ) {
            continue;
        }

        /*
         * Quantize to 5 bits/channel.
         */
        const r =
            pixels[i] >> 3;

        const g =
            pixels[i + 1] >> 3;

        const b =
            pixels[i + 2] >> 3;

        const key =
            (r << 10) |
            (g << 5) |
            b;

        let item =
            colorMap.get(key);

        if (!item) {

            item = {
                key,
                count: 1,
                r: pixels[i],
                g: pixels[i + 1],
                b: pixels[i + 2]
            };

            colorMap.set(
                key,
                item
            );

            colors.push(item);

        } else {

            item.count++;
        }
    }

    /*
     * Keep the most common 254 colors.
     *
     * Index 0 = black fallback.
     * Index 1 = transparent/unused fallback.
     */
    colors.sort(
        (a, b) =>
            b.count - a.count
    );

    const selected =
        colors.slice(0, 254);

    const palette =
        new Uint8Array(
            256 * 3
        );

    /*
     * Background/fallback colors.
     */
    palette[0] = 0;
    palette[1] = 0;
    palette[2] = 0;

    for (
        let i = 0;
        i < selected.length;
        i++
    ) {

        palette[
            (i + 1) * 3
        ] =
            selected[i].r;

        palette[
            (i + 1) * 3 + 1
        ] =
            selected[i].g;

        palette[
            (i + 1) * 3 + 2
        ] =
            selected[i].b;
    }

    /*
     * Build lookup.
     */
    const lookup =
        new Map();

    for (
        let i = 0;
        i < selected.length;
        i++
    ) {

        lookup.set(
            selected[i].key,
            i + 1
        );
    }

    /*
     * Map pixels.
     */
    const indices =
        new Uint8Array(
            pixels.length / 4
        );

    for (
        let i = 0, p = 0;
        i < pixels.length;
        i += 4, p++
    ) {

        const alpha =
            pixels[i + 3];

        if (
            alpha === 0
        ) {

            indices[p] = 0;
            continue;
        }

        const r =
            pixels[i] >> 3;

        const g =
            pixels[i + 1] >> 3;

        const b =
            pixels[i + 2] >> 3;

        const key =
            (r << 10) |
            (g << 5) |
            b;

        if (
            lookup.has(key)
        ) {

            indices[p] =
                lookup.get(key);

        } else {

            /*
             * Nearest color.
             */
            let best = 1;
            let bestDistance =
                Infinity;

            for (
                let c = 0;
                c < selected.length;
                c++
            ) {

                const dr =
                    pixels[i] -
                    selected[c].r;

                const dg =
                    pixels[i + 1] -
                    selected[c].g;

                const db =
                    pixels[i + 2] -
                    selected[c].b;

                const distance =
                    dr * dr +
                    dg * dg +
                    db * db;

                if (
                    distance <
                    bestDistance
                ) {

                    bestDistance =
                        distance;

                    best =
                        c + 1;
                }
            }

            indices[p] =
                best;
        }
    }

    return {
        palette,
        indices
    };
}


/* ---------------------------------------------------------
   Encode GIF
   --------------------------------------------------------- */

async function encodeGIF(
    frames,
    width,
    height,
    delays,
    token
) {

    const bytes = [];

    /*
     * Header.
     */
    pushBytes(
        bytes,
        new TextEncoder().encode(
            "GIF89a"
        )
    );

    /*
     * Logical Screen Descriptor.
     *
     * 256 color global palette.
     */
    push16(bytes, width);
    push16(bytes, height);

    /*
     * GCT flag = 1
     * Color resolution = 7
     * Sort = 0
     * GCT size = 7 => 256 colors
     */
    bytes.push(0xF7);

    /*
     * Background index.
     */
    bytes.push(0);

    /*
     * Pixel aspect ratio.
     */
    bytes.push(0);

    /*
     * Global palette from first frame.
     */
    const firstPalette =
        buildPalette(frames[0]);

    pushBytes(
        bytes,
        firstPalette.palette
    );

    /*
     * Each frame.
     */
    for (
        let frameIndex = 0;
        frameIndex < frames.length;
        frameIndex++
    ) {

        if (
            token !== renderToken
        ) {

            throw new Error(
                "Rendering stopped."
            );
        }

        setInfo(
            `Encoding GIF frame ` +
            `${frameIndex + 1} / ${frames.length}`
        );

        showProgress(
            80 +
            (
                frameIndex /
                frames.length
            ) * 20
        );

        const paletteData =
            buildPalette(
                frames[frameIndex]
            );

        /*
         * Graphic Control Extension.
         *
         * No transparency:
         * transparent source pixels are
         * rendered black.
         */
        bytes.push(
            0x21,
            0xF9,
            0x04,
            0x00
        );

        const delayCs =
            Math.max(
                2,
                Math.round(
                    delays[frameIndex] / 10
                )
            );

        push16(
            bytes,
            delayCs
        );

        bytes.push(
            0,
            0
        );

        /*
         * Image descriptor.
         */
        bytes.push(0x2C);

        push16(bytes, 0);
        push16(bytes, 0);

        push16(bytes, width);
        push16(bytes, height);

        /*
         * Local color table.
         */
        bytes.push(0x87);

        pushBytes(
            bytes,
            paletteData.palette
        );

        /*
         * LZW.
         */
        const minCodeSize = 8;

        bytes.push(
            minCodeSize
        );

        const compressed =
            encodeLZW(
                paletteData.indices,
                minCodeSize
            );

        /*
         * Sub-blocks.
         */
        let offset = 0;

        while (
            offset <
            compressed.length
        ) {

            const size =
                Math.min(
                    255,
                    compressed.length -
                    offset
                );

            bytes.push(size);

            for (
                let i = 0;
                i < size;
                i++
            ) {

                bytes.push(
                    compressed[
                        offset + i
                    ]
                );
            }

            offset += size;

            await nextFrame();
        }

        bytes.push(0);

        await nextFrame();
    }

    /*
     * Trailer.
     */
    bytes.push(0x3B);

    return new Blob(
        [
            new Uint8Array(bytes)
        ],
        {
            type: "image/gif"
        }
    );
}


/* =========================================================
   RENDER GIF
   ========================================================= */

async function processGIF(
    blob,
    token
) {

    setInfo(
        "Reading GIF..."
    );

    const decoded =
        await decodeGIF(
            blob,
            token
        );

    if (
        token !== renderToken
    ) {
        throw new Error(
            "Rendering stopped."
        );
    }

    const resolution =
        calculateResolution(
            decoded.width,
            decoded.height,
            qualitySelect.value,
            true
        );

    const asciiWidth =
        resolution.width;

    const asciiHeight =
        resolution.height;

    currentWidth =
        asciiWidth;

    currentHeight =
        asciiHeight;

    const outputPixels =
        asciiWidth *
        CHAR_WIDTH *
        asciiHeight *
        CHAR_HEIGHT;

    if (
        outputPixels >
        MAX_OUTPUT_PIXELS
    ) {
        throw new Error(
            "Requested output is too large."
        );
    }

    const renderedFrames = [];
    const delays = [];

    placeholder.style.display =
        "none";

    for (
        let i = 0;
        i < decoded.frames.length;
        i++
    ) {

        if (
            token !== renderToken
        ) {
            throw new Error(
                "Rendering stopped."
            );
        }

        setInfo(
            `Rendering GIF frame ` +
            `${i + 1} / ${decoded.frames.length}`
        );

        showProgress(
            (i /
                decoded.frames.length) *
            70
        );

        const imageData =
            gifFrameToImageData(
                decoded.frames[i],
                decoded.width,
                decoded.height,
                asciiWidth,
                asciiHeight
            );

        currentImageData =
            imageData;

        renderBinaryFrame(
            imageData,
            asciiWidth,
            asciiHeight,
            token
        );

        /*
         * Make a copy because the canvas is reused.
         */
        const copy =
            new ImageData(
                new Uint8ClampedArray(
                    imageData.data
                ),
                imageData.width,
                imageData.height
            );

        renderedFrames.push(copy);

        delays.push(
            decoded.frames[i].delay
        );

        fitCanvasToScreen();

        await nextFrame();
    }

    /*
     * Render the final frame again for preview.
     */
    renderBinaryFrame(
        currentImageData,
        asciiWidth,
        asciiHeight,
        token
    );

    fitCanvasToScreen();

    setInfo(
        "Encoding GIF..."
    );

    showProgress(75);

    const gifBlob =
        await encodeGIF(
            renderedFrames,
            asciiWidth,
            asciiHeight,
            delays,
            token
        );

    return {
        blob: gifBlob,
        frames: renderedFrames.length,
        width: asciiWidth,
        height: asciiHeight
    };
}


/* =========================================================
   RENDER WEBP
   ========================================================= */

async function processWebP(
    blob,
    token
) {

    /*
     * Browser-native createImageBitmap handles
     * static WebP everywhere modern browsers support WebP.
     *
     * Animated WebP is intentionally handled through
     * the browser's <img> decoder below.
     */

    setInfo(
        "Loading WebP..."
    );

    const url =
        URL.createObjectURL(blob);

    try {

        const image =
            new Image();

        image.decoding =
            "async";

        image.src =
            url;

        await image.decode();

        if (
            token !== renderToken
        ) {
            throw new Error(
                "Rendering stopped."
            );
        }

        /*
         * Browsers expose the animation through the image
         * element, but JavaScript cannot reliably step through
         * all animated WebP frames without WebCodecs.
         *
         * Therefore the browser-decoded visible frame is used.
         */

        const resolution =
            calculateResolution(
                image.naturalWidth,
                image.naturalHeight,
                qualitySelect.value,
                false
            );

        sourceCanvas.width =
            resolution.width;

        sourceCanvas.height =
            resolution.height;

        const ctx =
            sourceCanvas.getContext(
                "2d",
                {
                    willReadFrequently: true
                }
            );

        ctx.drawImage(
            image,
            0,
            0,
            resolution.width,
            resolution.height
        );

        const imageData =
            ctx.getImageData(
                0,
                0,
                resolution.width,
                resolution.height
            );

        currentImageData =
            imageData;

        currentWidth =
            resolution.width;

        currentHeight =
            resolution.height;

        placeholder.style.display =
            "none";

        renderBinaryFrame(
            imageData,
            resolution.width,
            resolution.height,
            token
        );

        fitCanvasToScreen();

        return {
            width: resolution.width,
            height: resolution.height
        };

    } finally {

        URL.revokeObjectURL(url);
    }
}


/* =========================================================
   STATIC → GIF
   ========================================================= */

async function createStaticGIF(
    imageData,
    width,
    height,
    token
) {

    const blob =
        await encodeGIF(
            [imageData],
            width,
            height,
            [1000],
            token
        );

    return blob;
}


/* =========================================================
   SHOW GIF
   ========================================================= */

function showGeneratedGIF(blob) {

    if (
        currentGifUrl
    ) {

        URL.revokeObjectURL(
            currentGifUrl
        );
    }

    currentGifBlob =
        blob;

    currentGifUrl =
        URL.createObjectURL(blob);

    gifPreview.src =
        currentGifUrl;

    downloadArea.style.display =
        "block";

    downloadBtn.style.display =
        "inline-block";
}


/* =========================================================
   MAIN PROCESS
   ========================================================= */

async function processImage() {

    renderToken++;

    const token =
        renderToken;

    convertBtn.disabled =
        true;

    stopBtn.style.display =
        "inline-block";

    downloadBtn.style.display =
        "none";

    copyBtn.style.display =
        "none";

    hideError();
    hideWarning();
    hideProgress();

    if (
        currentGifUrl
    ) {

        URL.revokeObjectURL(
            currentGifUrl
        );

        currentGifUrl =
            null;
    }

    currentGifBlob =
        null;

    downloadArea.style.display =
        "none";

    clearOutput();

    try {

        const input =
            await getInputSource();

        if (
            token !== renderToken
        ) {
            return;
        }

        const mime =
            (
                input.mime ||
                input.blob.type ||
                ""
            ).toLowerCase();

        let result;

        /*
         * GIF:
         *
         * Use our built-in GIF decoder.
         */
        if (
            mime === "image/gif" ||
            guessMime(
                imgUrl.value
            ) === "image/gif"
        ) {

            result =
                await processGIF(
                    input.blob,
                    token
                );

            showGeneratedGIF(
                result.blob
            );

            setInfo(
                `Complete — GIF → binary GIF | ` +
                `${decodedSafeDimension(
                    result.width
                )} × ` +
                `${decodedSafeDimension(
                    result.height
                )} character cells | ` +
                `${result.frames} frames`
            );

        } else {

            /*
             * Static images and WebP.
             */
            result =
                await decodeStatic(
                    input.blob,
                    token
                );

            if (
                !result
            ) {
                return;
            }

            setInfo(
                `Encoding ${mime === "image/webp"
                    ? "WebP"
                    : "image"} as GIF...`
            );

            showProgress(80);

            const gifBlob =
                await createStaticGIF(
                    currentImageData,
                    currentWidth,
                    currentHeight,
                    token
                );

            if (
                token !== renderToken
            ) {
                throw new Error(
                    "Rendering stopped."
                );
            }

            showGeneratedGIF(
                gifBlob
            );

            setInfo(
                `Complete — ` +
                `${result.width} × ` +
                `${result.height} character cells`
            );
        }

        copyBtn.style.display =
            "inline-block";

        showProgress(100);

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    300
                )
        );

        hideProgress();

    } catch (err) {

        console.error(
            "Binary GIF conversion error:",
            err
        );

        if (
            token !== renderToken
        ) {
            return;
        }

        showError(
            err &&
            err.message
                ? err.message
                : "Something went wrong."
        );

        setInfo(
            "Processing failed."
        );

        hideProgress();

    } finally {

        if (
            token === renderToken
        ) {

            convertBtn.disabled =
                false;

            stopBtn.style.display =
                "none";
        }
    }
}


/*
 * Prevent giant template values in info text.
 */
function decodedSafeDimension(value) {
    return Math.max(
        1,
        Math.floor(value)
    );
}


/* =========================================================
   STOP
   ========================================================= */

function stopRendering() {

    renderToken++;

    setInfo(
        "Rendering stopped."
    );

    convertBtn.disabled =
        false;

    stopBtn.style.display =
        "none";

    hideProgress();
}


/* =========================================================
   DOWNLOAD
   ========================================================= */

function downloadGIF() {

    if (
        !currentGifBlob ||
        !currentGifUrl
    ) {
        return;
    }

    const a =
        document.createElement("a");

    a.href =
        currentGifUrl;

    a.download =
        "binary-art.gif";

    document.body.appendChild(a);

    a.click();

    a.remove();
}


/* =========================================================
   COPY FRAME
   ========================================================= */

async function copyCurrentFrame() {

    if (
        !currentImageData ||
        !currentWidth ||
        !currentHeight
    ) {
        return;
    }

    const lines = [];

    for (
        let y = 0;
        y < currentHeight;
        y++
    ) {

        let line = "";

        for (
            let x = 0;
            x < currentWidth;
            x++
        ) {

            const index =
                (
                    y *
                    currentWidth +
                    x
                ) * 4;

            const alpha =
                currentImageData.data[
                    index + 3
                ];

            if (
                alpha === 0
            ) {

                line += " ";

                continue;
            }

            const r =
                currentImageData.data[
                    index
                ];

            const g =
                currentImageData.data[
                    index + 1
                ];

            const b =
                currentImageData.data[
                    index + 2
                ];

            const gray =
                0.299 * r +
                0.587 * g +
                0.114 * b;

            line +=
                gray < 128
                    ? "1"
                    : "0";
        }

        lines.push(line);
    }

    try {

        await navigator.clipboard.writeText(
            lines.join("\n")
        );

        setInfo(
            "Current frame copied as text."
        );

    } catch {

        alert(
            "Clipboard access failed."
        );
    }
}


/* =========================================================
   EVENTS
   ========================================================= */

convertBtn.addEventListener(
    "click",
    processImage
);

stopBtn.addEventListener(
    "click",
    stopRendering
);

downloadBtn.addEventListener(
    "click",
    downloadGIF
);

copyBtn.addEventListener(
    "click",
    copyCurrentFrame
);

imgUrl.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            processImage();
        }
    }
);

fileInput.addEventListener(
    "change",
    () => {

        if (
            fileInput.files.length
        ) {

            imgUrl.value = "";

            setInfo(
                `Selected: ` +
                fileInput.files[0].name
            );
        }
    }
);

window.addEventListener(
    "resize",
    fitCanvasToScreen
);


/* =========================================================
   INITIAL
   ========================================================= */

clearOutput();

</script>
