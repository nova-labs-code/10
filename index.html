<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Colored Binary GIF / WebP to GIF</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #121212;

}

.controls {

}

input[type="text"] {

    border-color: #0288d1;
}

    color: #ddd;
    max-width: 300px;
}

select,
button {
    padding: 10px 15px;

}

<body>

<h2>Image → Colored 1 / 0 Animated GIF</h2>

<div class="controls">

    <input
        type="text"
        id="imgUrl"
        placeholder="Paste image / GIF / WebP URL..."
    >

    <input
        type="file"
        id="fileInput"
        accept="image/*,.gif,.webp"
    >

    <select id="qualitySelect">
        <option value="35">Low — 35 characters wide</option>
        <option value="80" selected>Medium — 80 characters wide</option>
        <option value="150">High — 150 characters wide</option>
        <option value="300">Ultra — 300 characters wide</option>
        <option value="600">Extreme — 600 characters wide</option>
        <option value="1200">⚡ HYPER — 1200 characters wide</option>
    </select>

    <button id="convertBtn">Convert</button>
    <button id="stopBtn">Stop</button>
    <button id="downloadBtn">Download GIF</button>
    <button id="copyBtn">Copy Frame</button>

</div>

<div id="info">No image loaded.</div>

<div id="warning"></div>

<div id="error"></div>

<div id="progressContainer">
    <div id="progressBar"></div>
</div>

<div id="outputWrapper">

    <div id="canvasContainer">

        <div id="placeholder">
            Paste an image/GIF/WebP URL or choose a file above.
        </div>

        <canvas id="previewCanvas"></canvas>

    </div>

</div>

<div id="downloadArea">

    <h3>Generated GIF</h3>

    <img id="gifPreview">

    <div class="small">
        The GIF above is the actual generated binary GIF.
    </div>

</div>

<canvas id="sourceCanvas"></canvas>
<canvas id="frameCanvas"></canvas>


<!--
    Browser-compatible GIF decoder.

    This does NOT use WebCodecs or ImageDecoder.
    It works on normal GitHub Pages hosting.
-->
<script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.js"></script>

<!-- GIF encoder -->
<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>


<script>
"use strict";

/* =========================================================
   CONFIGURATION
   ========================================================= */

const CHAR_WIDTH = 6;
const CHAR_HEIGHT = 10;
const FONT_SIZE = 10;

const ANIMATED_MAX_WIDTH = 150;
const ANIMATED_MAX_HEIGHT = 150;

const MAX_ANIMATION_FRAMES = 300;

const ROWS_PER_BATCH = 1000;

const MAX_OUTPUT_PIXELS = 160000000;

const MIN_DISPLAY_SCALE = 0.20;

const GIF_WORKER =
    "https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js";


/* =========================================================
   ELEMENTS
   ========================================================= */

const imgUrl =
    document.getElementById("imgUrl");

const fileInput =
    document.getElementById("fileInput");

const qualitySelect =
    document.getElementById("qualitySelect");

const convertBtn =
    document.getElementById("convertBtn");

const stopBtn =
    document.getElementById("stopBtn");

const downloadBtn =
    document.getElementById("downloadBtn");

const copyBtn =
    document.getElementById("copyBtn");

const info =
    document.getElementById("info");

const warning =
    document.getElementById("warning");

const errorBox =
    document.getElementById("error");

const progressContainer =
    document.getElementById("progressContainer");

const progressBar =
    document.getElementById("progressBar");

const outputWrapper =
    document.getElementById("outputWrapper");

const canvasContainer =
    document.getElementById("canvasContainer");

const previewCanvas =
    document.getElementById("previewCanvas");

const placeholder =
    document.getElementById("placeholder");

const gifPreview =
    document.getElementById("gifPreview");

const downloadArea =
    document.getElementById("downloadArea");

const sourceCanvas =
    document.getElementById("sourceCanvas");

const frameCanvas =
    document.getElementById("frameCanvas");


/* =========================================================
   STATE
   ========================================================= */

let renderToken = 0;

let currentGifBlob = null;

let currentGifUrl = null;

let currentImageData = null;

let currentWidth = 0;

let currentHeight = 0;


/* =========================================================
   HELPERS
   ========================================================= */

function nextFrame() {
    return new Promise(resolve => {
        requestAnimationFrame(resolve);
    });
}


function sleep(ms) {
    return new Promise(resolve => {
        setTimeout(resolve, ms);
    });
}


function clamp(value, min, max) {
    return Math.max(
        min,
        Math.min(max, value)
    );
}


function setInfo(text) {
    info.textContent = text;
}


function showError(text) {
    errorBox.textContent = text;
    errorBox.style.display = "block";
}


function hideError() {
    errorBox.textContent = "";
    errorBox.style.display = "none";
}


function showWarning(text) {
    warning.textContent = text;
    warning.style.display = "block";
}


function hideWarning() {
    warning.textContent = "";
    warning.style.display = "none";
}


function showProgress(percent) {
    progressContainer.style.display = "block";

    progressBar.style.width =
        clamp(percent, 0, 100) + "%";
}


function hideProgress() {
    progressContainer.style.display = "none";
    progressBar.style.width = "0%";
}


/* =========================================================
   OUTPUT RESET
   ========================================================= */

function clearOutput() {

    previewCanvas.width = 1;
    previewCanvas.height = 1;

    previewCanvas.style.width = "1px";
    previewCanvas.style.height = "1px";

    placeholder.style.display = "block";
}


/* =========================================================
   FIT CANVAS
   ========================================================= */

function fitCanvasToScreen() {

    if (
        previewCanvas.width <= 1 ||
        previewCanvas.height <= 1
    ) {
        return;
    }

    const availableWidth =
        Math.max(
            1,
            outputWrapper.clientWidth - 30
        );

    const naturalWidth =
        previewCanvas.width;

    let scale =
        Math.min(
            1,
            availableWidth / naturalWidth
        );

    if (
        scale < MIN_DISPLAY_SCALE
    ) {
        scale = MIN_DISPLAY_SCALE;
    }

    previewCanvas.style.width =
        Math.round(
            naturalWidth * scale
        ) + "px";

    previewCanvas.style.height =
        Math.round(
            previewCanvas.height * scale
        ) + "px";
}


/* =========================================================
   RESOLUTION
   ========================================================= */

function calculateResolution(
    sourceWidth,
    sourceHeight,
    quality,
    animated
) {

    let width;

    if (animated) {

        width =
            Math.min(
                sourceWidth,
                ANIMATED_MAX_WIDTH
            );

    } else if (
        quality === "1200"
    ) {

        width =
            sourceWidth;

    } else {

        width =
            Math.min(
                parseInt(quality, 10),
                sourceWidth
            );
    }

    const imageRatio =
        sourceHeight / sourceWidth;

    const characterCorrection =
        CHAR_WIDTH / CHAR_HEIGHT;

    let height =
        Math.max(
            1,
            Math.round(
                width *
                imageRatio *
                characterCorrection
            )
        );

    if (animated) {

        if (
            height > ANIMATED_MAX_HEIGHT
        ) {

            const scale =
                ANIMATED_MAX_HEIGHT / height;

            height =
                ANIMATED_MAX_HEIGHT;

            width =
                Math.max(
                    1,
                    Math.round(
                        width * scale
                    )
                );
        }
    }

    return {
        width,
        height
    };
}


/* =========================================================
   MIME
   ========================================================= */

function guessMime(name) {

    const clean =
        String(name || "")
            .split("?")[0]
            .split("#")[0]
            .toLowerCase();

    if (clean.endsWith(".gif")) {
        return "image/gif";
    }

    if (clean.endsWith(".webp")) {
        return "image/webp";
    }

    if (clean.endsWith(".png")) {
        return "image/png";
    }

    if (
        clean.endsWith(".jpg") ||
        clean.endsWith(".jpeg")
    ) {
        return "image/jpeg";
    }

    return "";
}


/* =========================================================
   URL LOADING
   ========================================================= */

async function getURLData(url) {

    const response =
        await fetch(
            url,
            {
                mode: "cors"
            }
        );

    if (!response.ok) {

        throw new Error(
            "Could not download URL. HTTP " +
            response.status +
            ". The remote server may not allow CORS."
        );
    }

    const blob =
        await response.blob();

    return {
        blob: blob,
        mime:
            blob.type ||
            guessMime(url)
    };
}


/* =========================================================
   INPUT SOURCE
   ========================================================= */

async function getInputSource() {

    const file =
        fileInput.files[0];

    if (file) {

        return {
            blob: file,
            mime:
                file.type ||
                guessMime(file.name)
        };
    }

    const url =
        imgUrl.value.trim();

    if (!url) {

        throw new Error(
            "Please provide an image URL or choose a file."
        );
    }

    return await getURLData(url);
}


/* =========================================================
   DETECT GIF
   ========================================================= */

function isGIF(blob, mime) {

    if (
        mime &&
        mime.toLowerCase() === "image/gif"
    ) {
        return true;
    }

    return guessMime(
        blob.name || ""
    ) === "image/gif";
}


/* =========================================================
   READ BLOB
   ========================================================= */

async function blobToUint8Array(blob) {

    const buffer =
        await blob.arrayBuffer();

    return new Uint8Array(buffer);
}


/* =========================================================
   GIF DECODER
   =========================================================

   This replaces ImageDecoder/WebCodecs completely.

   omggif reads GIF frames directly from the GIF binary.

   It handles:
   - GIF dimensions
   - frame count
   - frame delay
   - disposal methods
   - transparency
   - GIF palette
   - animated GIFs

   ========================================================= */

function decodeGIFFrames(
    bytes,
    token
) {

    if (
        token !== renderToken
    ) {
        throw new Error(
            "Rendering stopped."
        );
    }

    if (
        typeof GifReader === "undefined"
    ) {

        throw new Error(
            "GIF decoder library failed to load."
        );
    }

    let reader;

    try {

        reader =
            new GifReader(bytes);

    } catch (err) {

        throw new Error(
            "The GIF decoder could not read this file. " +
            "The file may be corrupt or not actually be a GIF."
        );
    }

    const width =
        reader.width;

    const height =
        reader.height;

    if (
        !width ||
        !height
    ) {

        throw new Error(
            "Could not determine the animated GIF dimensions."
        );
    }

    let frameCount =
        reader.numFrames();

    if (
        !frameCount ||
        frameCount < 1
    ) {

        throw new Error(
            "The GIF contains no frames."
        );
    }

    if (
        frameCount > MAX_ANIMATION_FRAMES
    ) {

        showWarning(
            "This GIF contains " +
            frameCount +
            " frames. Only the first " +
            MAX_ANIMATION_FRAMES +
            " frames will be converted."
        );

        frameCount =
            MAX_ANIMATION_FRAMES;
    }

    return {
        reader,
        width,
        height,
        frameCount
    };
}


/* =========================================================
   GIF FRAME → RGBA
   ========================================================= */

function decodeGIFFrame(
    reader,
    frameIndex,
    width,
    height,
    rgbaBuffer
) {

    /*
     * Decode directly into an RGBA Uint8Array.
     *
     * omggif writes transparent pixels using
     * the GIF's transparent color index.
     */
    reader.decodeAndBlitFrameRGBA(
        frameIndex,
        rgbaBuffer
    );

    return rgbaBuffer;
}


/* =========================================================
   RGBA → RESIZED IMAGE DATA
   ========================================================= */

function resizeRGBA(
    rgba,
    sourceWidth,
    sourceHeight,
    targetWidth,
    targetHeight
) {

    frameCanvas.width =
        targetWidth;

    frameCanvas.height =
        targetHeight;

    const ctx =
        frameCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );

    const imageData =
        ctx.createImageData(
            targetWidth,
            targetHeight
        );

    const dst =
        imageData.data;

    for (
        let y = 0;
        y < targetHeight;
        y++
    ) {

        const sy =
            Math.min(
                sourceHeight - 1,
                Math.floor(
                    y *
                    sourceHeight /
                    targetHeight
                )
            );

        for (
            let x = 0;
            x < targetWidth;
            x++
        ) {

            const sx =
                Math.min(
                    sourceWidth - 1,
                    Math.floor(
                        x *
                        sourceWidth /
                        targetWidth
                    )
                );

            const srcIndex =
                (
                    sy *
                    sourceWidth +
                    sx
                ) * 4;

            const dstIndex =
                (
                    y *
                    targetWidth +
                    x
                ) * 4;

            dst[dstIndex] =
                rgba[srcIndex];

            dst[dstIndex + 1] =
                rgba[srcIndex + 1];

            dst[dstIndex + 2] =
                rgba[srcIndex + 2];

            dst[dstIndex + 3] =
                rgba[srcIndex + 3];
        }
    }

    return imageData;
}


/* =========================================================
   BINARY ART RENDERER
   ========================================================= */

function renderBinaryFrame(
    imageData,
    asciiWidth,
    asciiHeight,
    token
) {

    const outputWidth =
        asciiWidth *
        CHAR_WIDTH;

    const outputHeight =
        asciiHeight *
        CHAR_HEIGHT;

    previewCanvas.width =
        outputWidth;

    previewCanvas.height =
        outputHeight;

    const ctx =
        previewCanvas.getContext("2d");

    ctx.fillStyle =
        "#000000";

    ctx.fillRect(
        0,
        0,
        outputWidth,
        outputHeight
    );

    ctx.font =
        `${FONT_SIZE}px "Courier New", monospace`;

    ctx.textBaseline =
        "top";

    for (
        let y = 0;
        y < asciiHeight;
        y++
    ) {

        if (
            token !== renderToken
        ) {
            return false;
        }

        for (
            let x = 0;
            x < asciiWidth;
            x++
        ) {

            const index =
                (
                    y *
                    asciiWidth +
                    x
                ) * 4;

            const r =
                imageData.data[index];

            const g =
                imageData.data[index + 1];

            const b =
                imageData.data[index + 2];

            const alpha =
                imageData.data[index + 3];

            /*
             * ONLY fully transparent pixels are blank.
             */
            if (
                alpha === 0
            ) {
                continue;
            }

            const gray =
                0.299 * r +
                0.587 * g +
                0.114 * b;

            /*
             * Every visible pixel becomes
             * either 1 or 0.
             */
            const char =
                gray < 128
                    ? "1"
                    : "0";

            ctx.fillStyle =
                `rgba(${r},${g},${b},${alpha / 255})`;

            ctx.fillText(
                char,
                x * CHAR_WIDTH,
                y * CHAR_HEIGHT
            );
        }
    }

    return true;
}


/* =========================================================
   RENDER GIF FRAME
   ========================================================= */

async function renderGIFFrame(
    rgba,
    sourceWidth,
    sourceHeight,
    asciiWidth,
    asciiHeight,
    token
) {

    const imageData =
        resizeRGBA(
            rgba,
            sourceWidth,
            sourceHeight,
            asciiWidth,
            asciiHeight
        );

    if (
        token !== renderToken
    ) {
        return false;
    }

    currentImageData =
        imageData;

    currentWidth =
        asciiWidth;

    currentHeight =
        asciiHeight;

    const success =
        renderBinaryFrame(
            imageData,
            asciiWidth,
            asciiHeight,
            token
        );

    if (!success) {
        return false;
    }

    fitCanvasToScreen();

    return true;
}


/* =========================================================
   GIF FRAME DELAY
   ========================================================= */

function getGIFFrameDelay(
    reader,
    frameIndex
) {

    let info;

    try {

        info =
            reader.frameInfo(
                frameIndex
            );

    } catch (err) {

        return 100;
    }

    /*
     * omggif delay is in hundredths of a second.
     */
    let delay =
        info && typeof info.delay === "number"
            ? info.delay * 10
            : 100;

    /*
     * Browser GIFs commonly use very small delays.
     * GIF output needs a useful minimum.
     */
    delay =
        Math.max(
            20,
            Math.round(delay)
        );

    return delay;
}


/* =========================================================
   ENCODE GIF
   ========================================================= */

async function encodeGIF(
    frameCanvases,
    delays,
    width,
    height,
    token
) {

    const gif =
        new GIF({

            workers: 2,

            quality: 10,

            width: width,

            height: height,

            workerScript: GIF_WORKER,

            repeat: 0,

            background: "#000000"
        });

    for (
        let i = 0;
        i < frameCanvases.length;
        i++
    ) {

        if (
            token !== renderToken
        ) {

            try {
                gif.abort();
            } catch (e) {}

            throw new Error(
                "Rendering stopped."
            );
        }

        gif.addFrame(
            frameCanvases[i],
            {
                copy: true,
                delay: delays[i]
            }
        );
    }

    setInfo(
        "Encoding final GIF..."
    );

    showProgress(92);

    const blob =
        await new Promise(
            (resolve, reject) => {

                let finished = false;

                gif.on(
                    "finished",
                    function(result) {

                        if (!finished) {
                            finished = true;
                            resolve(result);
                        }
                    }
                );

                gif.on(
                    "abort",
                    function() {

                        if (!finished) {
                            finished = true;

                            reject(
                                new Error(
                                    "GIF encoding was aborted."
                                )
                            );
                        }
                    }
                );

                gif.on(
                    "error",
                    function(err) {

                        if (!finished) {
                            finished = true;
                            reject(err);
                        }
                    }
                );

                gif.on(
                    "progress",
                    function(progress) {

                        showProgress(
                            92 +
                            progress * 8
                        );
                    }
                );

                try {

                    gif.render();

                } catch (err) {

                    if (!finished) {
                        finished = true;
                        reject(err);
                    }
                }
            }
        );

    return blob;
}


/* =========================================================
   PROCESS ANIMATED GIF
   ========================================================= */

async function processAnimatedGIF(
    blob,
    token
) {

    setInfo(
        "Reading GIF..."
    );

    showProgress(3);

    const bytes =
        await blobToUint8Array(blob);

    if (
        token !== renderToken
    ) {
        throw new Error(
            "Rendering stopped."
        );
    }

    const decoded =
        decodeGIFFrames(
            bytes,
            token
        );

    const sourceWidth =
        decoded.width;

    const sourceHeight =
        decoded.height;

    const frameCount =
        decoded.frameCount;

    const resolution =
        calculateResolution(
            sourceWidth,
            sourceHeight,
            qualitySelect.value,
            true
        );

    const asciiWidth =
        resolution.width;

    const asciiHeight =
        resolution.height;

    const outputWidth =
        asciiWidth *
        CHAR_WIDTH;

    const outputHeight =
        asciiHeight *
        CHAR_HEIGHT;

    const outputPixels =
        outputWidth *
        outputHeight;

    if (
        outputPixels >
        MAX_OUTPUT_PIXELS
    ) {

        throw new Error(
            "The requested animated output is too large."
        );
    }

    setInfo(
        `GIF detected: ${sourceWidth} × ${sourceHeight}, ` +
        `${frameCount} frame${frameCount === 1 ? "" : "s"}`
    );

    const rgba =
        new Uint8Array(
            sourceWidth *
            sourceHeight *
            4
        );

    const frameCanvases = [];
    const delays = [];

    for (
        let frameIndex = 0;
        frameIndex < frameCount;
        frameIndex++
    ) {

        if (
            token !== renderToken
        ) {

            throw new Error(
                "Rendering stopped."
            );
        }

        const percent =
            frameIndex /
            frameCount *
            70;

        showProgress(
            5 + percent
        );

        setInfo(
            `Decoding frame ${frameIndex + 1} / ${frameCount}`
        );

        /*
         * Decode the frame.
         */
        decodeGIFFrame(
            decoded.reader,
            frameIndex,
            sourceWidth,
            sourceHeight,
            rgba
        );

        /*
         * Convert it to binary art.
         */
        const success =
            await renderGIFFrame(
                rgba,
                sourceWidth,
                sourceHeight,
                asciiWidth,
                asciiHeight,
                token
            );

        if (!success) {

            throw new Error(
                "Rendering stopped."
            );
        }

        /*
         * Important:
         *
         * gif.js needs its own copy.
         * We create a separate canvas here so
         * the next frame cannot overwrite it.
         */
        const frameCanvas =
            document.createElement("canvas");

        frameCanvas.width =
            previewCanvas.width;

        frameCanvas.height =
            previewCanvas.height;

        const frameCtx =
            frameCanvas.getContext("2d");

        frameCtx.drawImage(
            previewCanvas,
            0,
            0
        );

        frameCanvases.push(
            frameCanvas
        );

        delays.push(
            getGIFFrameDelay(
                decoded.reader,
                frameIndex
            )
        );

        /*
         * Keep UI responsive.
         */
        await nextFrame();
    }

    /*
     * Display final frame.
     */
    fitCanvasToScreen();

    setInfo(
        "Encoding final GIF..."
    );

    const blobResult =
        await encodeGIF(
            frameCanvases,
            delays,
            outputWidth,
            outputHeight,
            token
        );

    return {
        blob: blobResult,
        sourceWidth: sourceWidth,
        sourceHeight: sourceHeight,
        asciiWidth: asciiWidth,
        asciiHeight: asciiHeight,
        frameCount: frameCount,
        outputWidth: outputWidth,
        outputHeight: outputHeight
    };
}


/* =========================================================
   STATIC IMAGE
   ========================================================= */

async function renderStatic(
    blob,
    token
) {

    const bitmap =
        await createImageBitmap(blob);

    if (
        token !== renderToken
    ) {

        bitmap.close();

        return null;
    }

    const sourceWidth =
        bitmap.width;

    const sourceHeight =
        bitmap.height;

    const resolution =
        calculateResolution(
            sourceWidth,
            sourceHeight,
            qualitySelect.value,
            false
        );

    const asciiWidth =
        resolution.width;

    const asciiHeight =
        resolution.height;

    const outputPixels =
        asciiWidth *
        CHAR_WIDTH *
        asciiHeight *
        CHAR_HEIGHT;

    if (
        outputPixels >
        MAX_OUTPUT_PIXELS
    ) {

        bitmap.close();

        throw new Error(
            "The requested output is too large for this browser."
        );
    }

    sourceCanvas.width =
        asciiWidth;

    sourceCanvas.height =
        asciiHeight;

    const sourceCtx =
        sourceCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );

    sourceCtx.clearRect(
        0,
        0,
        asciiWidth,
        asciiHeight
    );

    sourceCtx.drawImage(
        bitmap,
        0,
        0,
        asciiWidth,
        asciiHeight
    );

    bitmap.close();

    const imageData =
        sourceCtx.getImageData(
            0,
            0,
            asciiWidth,
            asciiHeight
        );

    currentImageData =
        imageData;

    currentWidth =
        asciiWidth;

    currentHeight =
        asciiHeight;

    placeholder.style.display =
        "none";

    previewCanvas.width =
        asciiWidth *
        CHAR_WIDTH;

    previewCanvas.height =
        asciiHeight *
        CHAR_HEIGHT;

    const ctx =
        previewCanvas.getContext("2d");

    ctx.fillStyle =
        "#000";

    ctx.fillRect(
        0,
        0,
        previewCanvas.width,
        previewCanvas.height
    );

    ctx.font =
        `${FONT_SIZE}px "Courier New", monospace`;

    ctx.textBaseline =
        "top";

    let row = 0;

    while (
        row < asciiHeight
    ) {

        if (
            token !== renderToken
        ) {

            return null;
        }

        const end =
            Math.min(
                row + ROWS_PER_BATCH,
                asciiHeight
            );

        for (
            let y = row;
            y < end;
            y++
        ) {

            for (
                let x = 0;
                x < asciiWidth;
                x++
            ) {

                const index =
                    (
                        y *
                        asciiWidth +
                        x
                    ) * 4;

                const r =
                    imageData.data[index];

                const g =
                    imageData.data[index + 1];

                const b =
                    imageData.data[index + 2];

                const alpha =
                    imageData.data[index + 3];

                if (
                    alpha === 0
                ) {
                    continue;
                }

                const gray =
                    0.299 * r +
                    0.587 * g +
                    0.114 * b;

                const char =
                    gray < 128
                        ? "1"
                        : "0";

                ctx.fillStyle =
                    `rgba(${r},${g},${b},${alpha / 255})`;

                ctx.fillText(
                    char,
                    x * CHAR_WIDTH,
                    y * CHAR_HEIGHT
                );
            }
        }

        row =
            end;

        showProgress(
            row /
            asciiHeight *
            80
        );

        setInfo(
            `Rendering static image: ` +
            `${Math.floor(
                row / asciiHeight * 100
            )}%`
        );

        await nextFrame();
    }

    fitCanvasToScreen();

    return {
        width: asciiWidth,
        height: asciiHeight
    };
}


/* =========================================================
   SHOW GENERATED GIF
   ========================================================= */

function showGeneratedGIF(blob) {

    if (
        currentGifUrl
    ) {

        URL.revokeObjectURL(
            currentGifUrl
        );
    }

    currentGifBlob =
        blob;

    currentGifUrl =
        URL.createObjectURL(blob);

    gifPreview.src =
        currentGifUrl;

    downloadArea.style.display =
        "block";

    downloadBtn.style.display =
        "inline-block";
}


/* =========================================================
   MAIN PROCESS
   ========================================================= */

async function processImage() {

    renderToken++;

    const token =
        renderToken;

    convertBtn.disabled =
        true;

    stopBtn.style.display =
        "inline-block";

    downloadBtn.style.display =
        "none";

    copyBtn.style.display =
        "none";

    hideError();
    hideWarning();
    hideProgress();

    if (
        currentGifUrl
    ) {

        URL.revokeObjectURL(
            currentGifUrl
        );

        currentGifUrl =
            null;
    }

    currentGifBlob =
        null;

    downloadArea.style.display =
        "none";

    clearOutput();

    try {

        setInfo(
            "Loading image..."
        );

        const input =
            await getInputSource();

        if (
            token !== renderToken
        ) {
            return;
        }

        const mime =
            (
                input.mime ||
                input.blob.type ||
                ""
            ).toLowerCase();

        /*
         * GIF goes through omggif.
         *
         * WebP goes through the normal browser
         * image decoder. If the WebP is animated,
         * this browser-only implementation cannot
         * extract its animation frames without
         * another decoder library.
         */
        if (
            isGIF(
                input.blob,
                mime
            )
        ) {

            const result =
                await processAnimatedGIF(
                    input.blob,
                    token
                );

            if (
                token !== renderToken
            ) {
                return;
            }

            showGeneratedGIF(
                result.blob
            );

            setInfo(
                `Complete — animated GIF → GIF | ` +
                `${result.sourceWidth} × ${result.sourceHeight} source | ` +
                `${result.asciiWidth} × ${result.asciiHeight} character cells | ` +
                `${result.frameCount} frames`
            );

            copyBtn.style.display =
                "inline-block";

            showProgress(100);

            await sleep(300);

            hideProgress();

            return;
        }

        /*
         * Static PNG/JPG/WebP.
         */
        const result =
            await renderStatic(
                input.blob,
                token
            );

        if (
            token !== renderToken ||
            !result
        ) {
            return;
        }

        setInfo(
            "Encoding static image as GIF..."
        );

        const gif =
            new GIF({

                workers: 2,

                quality: 10,

                width:
                    previewCanvas.width,

                height:
                    previewCanvas.height,

                workerScript:
                    GIF_WORKER,

                repeat: 0,

                background:
                    "#000000"
            });

        gif.addFrame(
            previewCanvas,
            {
                copy: true,
                delay: 1000
            }
        );

        const blob =
            await new Promise(
                (resolve, reject) => {

                    gif.on(
                        "finished",
                        resolve
                    );

                    gif.on(
                        "error",
                        reject
                    );

                    gif.on(
                        "progress",
                        function(progress) {

                            showProgress(
                                progress * 100
                            );
                        }
                    );

                    try {

                        gif.render();

                    } catch (err) {

                        reject(err);
                    }
                }
            );

        if (
            token !== renderToken
        ) {
            return;
        }

        showGeneratedGIF(
            blob
        );

        setInfo(
            `Complete — ` +
            `${result.width} × ${result.height} character cells`
        );

        copyBtn.style.display =
            "inline-block";

        showProgress(100);

        await sleep(300);

        hideProgress();

    } catch (err) {

        console.error(
            "Binary GIF conversion error:",
            err
        );

        if (
            token !== renderToken
        ) {
            return;
        }

        showError(
            err &&
            err.message
                ? err.message
                : String(err)
        );

        setInfo(
            "Processing failed."
        );

        hideProgress();

    } finally {

        if (
            token === renderToken
        ) {

            convertBtn.disabled =
                false;

            stopBtn.style.display =
                "none";
        }
    }
}


/* =========================================================
   STOP
   ========================================================= */

function stopRendering() {

    renderToken++;

    setInfo(
        "Rendering stopped."
    );

    convertBtn.disabled =
        false;

    stopBtn.style.display =
        "none";

    hideProgress();
}


/* =========================================================
   DOWNLOAD
   ========================================================= */

function downloadGIF() {

    if (
        !currentGifBlob ||
        !currentGifUrl
    ) {
        return;
    }

    const a =
        document.createElement("a");

    a.href =
        currentGifUrl;

    a.download =
        "binary-art.gif";

    document.body.appendChild(a);

    a.click();

    a.remove();
}


/* =========================================================
   COPY FRAME
   ========================================================= */

async function copyCurrentFrame() {

    if (
        !currentImageData ||
        currentWidth <= 0 ||
        currentHeight <= 0
    ) {
        return;
    }

    const lines = [];

    for (
        let y = 0;
        y < currentHeight;
        y++
    ) {

        let line = "";

        for (
            let x = 0;
            x < currentWidth;
            x++
        ) {

            const index =
                (
                    y *
                    currentWidth +
                    x
                ) * 4;

            const alpha =
                currentImageData.data[
                    index + 3
                ];

            if (
                alpha === 0
            ) {

                line += " ";

                continue;
            }

            const r =
                currentImageData.data[index];

            const g =
                currentImageData.data[index + 1];

            const b =
                currentImageData.data[index + 2];

            const gray =
                0.299 * r +
                0.587 * g +
                0.114 * b;

            line +=
                gray < 128
                    ? "1"
                    : "0";
        }

        lines.push(line);
    }

    try {

        await navigator.clipboard.writeText(
            lines.join("\n")
        );

        setInfo(
            "Current frame copied as text."
        );

    } catch (err) {

        /*
         * Fallback for browsers where Clipboard API
         * is unavailable.
         */
        const textarea =
            document.createElement("textarea");

        textarea.value =
            lines.join("\n");

        textarea.style.position =
            "fixed";

        textarea.style.left =
            "-9999px";

        document.body.appendChild(
            textarea
        );

        textarea.select();

        try {

            document.execCommand(
                "copy"
            );

            setInfo(
                "Current frame copied as text."
            );

        } catch (copyError) {

            showError(
                "Clipboard access failed."
            );

        } finally {

            textarea.remove();
        }
    }
}


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    function() {

        fitCanvasToScreen();

    }
);


/* =========================================================
   EVENTS
   ========================================================= */

convertBtn.addEventListener(
    "click",
    processImage
);

stopBtn.addEventListener(
    "click",
    stopRendering
);

downloadBtn.addEventListener(
    "click",
    downloadGIF
);

copyBtn.addEventListener(
    "click",
    copyCurrentFrame
);

imgUrl.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            processImage();
        }
    }
);

fileInput.addEventListener(
    "change",
    function() {

        if (
            fileInput.files.length
        ) {

            imgUrl.value = "";

            setInfo(
                "Selected: " +
                fileInput.files[0].name
            );
        }
    }
);


/* =========================================================
   INITIAL STATE
   ========================================================= */

clearOutput();

</script>

</body>
</html>
