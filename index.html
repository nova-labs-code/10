<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Colored Binary GIF / WebP to GIF</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #121212;
        color: #e0e0e0;
        padding: 20px;
        max-width: 1400px;

    }

    h2 {

        margin-top: 0;
    }

    .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
        flex-wrap: wrap;
    }

    input[type="text"] {
        flex: 1;
        padding: 10px;
        border-radius: 4px;
        border: 1px solid #333;
        background: #1e1e1e;
        color: white;
        min-width: 280px;
        outline: none;
        font-size: 14px;
    }

    input[type="text"]:focus {
        border-color: #0288d1;
    }

    input[type="file"] {
        color: #ddd;
        max-width: 300px;
    }

    select,
    button {
        padding: 10px 15px;
        border-radius: 4px;
        border: none;
        background: #0288d1;
        color: white;
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
    }

    select {
        min-width: 230px;
    }

    button:hover {
        background: #0277bd;
    }

    button:disabled {
        opacity: .5;
        cursor: not-allowed;
    }

    #stopBtn {
        display: none;

    }

    #stopBtn:hover {

    }

        background: #2e7d32;
    }

    #downloadBtn:hover {

    }

        display: none;
        background: #6a1b9a;
    }

        color: #aaa;

    }

    #warning {
        display: none;

        border: 1px solid #9a6b00;

    #error {
        display: none;
        background: #4a1010;

<body>

<h2>Image → Colored 1 / 0 Animated GIF</h2>

<div class="controls">

    <input
        type="text"
        id="imgUrl"
        placeholder="Paste image / GIF / WebP URL..."
    >

    <input
        type="file"
        id="fileInput"
        accept="image/*,.gif,.webp"
    >

    <select id="qualitySelect">
        <option value="35">
            Low — 35 characters wide
        </option>

        <option value="80" selected>
            Medium — 80 characters wide
        </option>

        <option value="150">
            High — 150 characters wide
        </option>

        <option value="300">
            Ultra — 300 characters wide
        </option>

        <option value="600">
            Extreme — 600 characters wide
        </option>

        <option value="1200">
            ⚡ HYPER — 1200 characters wide
        </option>
    </select>

    <button id="convertBtn">
        Convert
    </button>

    <button id="stopBtn">
        Stop
    </button>

    <button id="downloadBtn">
        Download GIF
    </button>

    <button id="copyBtn">
        Copy Frame
    </button>

</div>

<div id="info">
    No image loaded.
</div>

<div id="warning"></div>

<div id="error"></div>

<div id="progressContainer">
    <div id="progressBar"></div>
</div>

<div id="outputWrapper">

    <div id="canvasContainer">

        <div id="placeholder">
            Paste an image/GIF/WebP URL or choose a file above.
        </div>

        <canvas id="previewCanvas"></canvas>

    </div>

</div>

<div id="downloadArea">

    <h3>Generated GIF</h3>

    <img id="gifPreview">

    <div class="small">
        The GIF above is the actual generated binary GIF.
    </div>

</div>

<canvas id="sourceCanvas"></canvas>
<canvas id="frameCanvas"></canvas>


<!-- GIF encoder -->
<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>


<script>

"use strict";


/* =========================================================
   CONFIGURATION
   ========================================================= */

const CHAR_WIDTH = 6;
const CHAR_HEIGHT = 10;
const FONT_SIZE = 10;

const ANIMATED_MAX_WIDTH = 150;
const ANIMATED_MAX_HEIGHT = 150;

const MAX_ANIMATION_FRAMES = 300;

const ROWS_PER_BATCH = 1000;

const MAX_OUTPUT_PIXELS = 160000000;

const MIN_DISPLAY_SCALE = 0.20;

const GIF_WORKER =
    "https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js";


/* =========================================================
   ELEMENTS
   ========================================================= */

const imgUrl =
    document.getElementById("imgUrl");

const fileInput =
    document.getElementById("fileInput");

const qualitySelect =
    document.getElementById("qualitySelect");

const convertBtn =
    document.getElementById("convertBtn");

const stopBtn =
    document.getElementById("stopBtn");

const downloadBtn =
    document.getElementById("downloadBtn");

const copyBtn =
    document.getElementById("copyBtn");

const info =
    document.getElementById("info");

const warning =
    document.getElementById("warning");

const errorBox =
    document.getElementById("error");

const progressContainer =
    document.getElementById("progressContainer");

const progressBar =
    document.getElementById("progressBar");

const outputWrapper =
    document.getElementById("outputWrapper");

const previewCanvas =
    document.getElementById("previewCanvas");

const placeholder =
    document.getElementById("placeholder");

const gifPreview =
    document.getElementById("gifPreview");

const downloadArea =
    document.getElementById("downloadArea");

const sourceCanvas =
    document.getElementById("sourceCanvas");

const frameCanvas =
    document.getElementById("frameCanvas");


/* =========================================================
   STATE
   ========================================================= */

let renderToken = 0;

let currentGifBlob = null;

let currentGifUrl = null;

let currentImageData = null;

let currentWidth = 0;

let currentHeight = 0;


/* =========================================================
   HELPERS
   ========================================================= */

function nextFrame() {
    return new Promise(resolve => {
        requestAnimationFrame(resolve);
    });
}


function sleep(ms) {
    return new Promise(resolve => {
        setTimeout(resolve, ms);
    });
}


function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}


function setInfo(text) {
    info.textContent = text;
}


function showError(text) {
    errorBox.textContent = text;
    errorBox.style.display = "block";
}


function hideError() {
    errorBox.textContent = "";
    errorBox.style.display = "none";
}


function showWarning(text) {
    warning.textContent = text;
    warning.style.display = "block";
}


function hideWarning() {
    warning.textContent = "";
    warning.style.display = "none";
}


function showProgress(percent) {
    progressContainer.style.display = "block";
    progressBar.style.width =
        clamp(percent, 0, 100) + "%";
}


function hideProgress() {
    progressContainer.style.display = "none";
    progressBar.style.width = "0%";
}


/* =========================================================
   OUTPUT
   ========================================================= */

function clearOutput() {

    previewCanvas.width = 1;
    previewCanvas.height = 1;

    previewCanvas.style.width = "1px";
    previewCanvas.style.height = "1px";

    placeholder.style.display = "block";
}


function fitCanvasToScreen() {

    if (
        previewCanvas.width <= 1 ||
        previewCanvas.height <= 1
    ) {
        return;
    }

    const availableWidth =
        Math.max(
            1,
            outputWrapper.clientWidth - 30
        );

    const naturalWidth =
        previewCanvas.width;

    let scale =
        Math.min(
            1,
            availableWidth / naturalWidth
        );

    if (scale < MIN_DISPLAY_SCALE) {
        scale = MIN_DISPLAY_SCALE;
    }

    previewCanvas.style.width =
        Math.round(
            naturalWidth * scale
        ) + "px";

    previewCanvas.style.height =
        Math.round(
            previewCanvas.height * scale
        ) + "px";
}


/* =========================================================
   RESOLUTION
   ========================================================= */

function calculateResolution(
    sourceWidth,
    sourceHeight,
    quality,
    animated
) {

    let width;

    if (animated) {

        width =
            Math.min(
                sourceWidth,
                ANIMATED_MAX_WIDTH
            );

    } else if (quality === "1200") {

        width = sourceWidth;

    } else {

        width =
            Math.min(
                parseInt(quality, 10),
                sourceWidth
            );
    }

    const imageRatio =
        sourceHeight / sourceWidth;

    const characterCorrection =
        CHAR_WIDTH / CHAR_HEIGHT;

    let height =
        Math.max(
            1,
            Math.round(
                width *
                imageRatio *
                characterCorrection
            )
        );

    if (animated && height > ANIMATED_MAX_HEIGHT) {

        const scale =
            ANIMATED_MAX_HEIGHT / height;

        height =
            ANIMATED_MAX_HEIGHT;

        width =
            Math.max(
                1,
                Math.round(width * scale)
            );
    }

    return {
        width,
        height
    };
}


/* =========================================================
   MIME DETECTION
   ========================================================= */

function guessMime(name) {

    const clean =
        String(name || "")
            .split("?")[0]
            .split("#")[0]
            .toLowerCase();

    if (clean.endsWith(".gif")) {
        return "image/gif";
    }

    if (clean.endsWith(".webp")) {
        return "image/webp";
    }

    if (clean.endsWith(".png")) {
        return "image/png";
    }

    if (
        clean.endsWith(".jpg") ||
        clean.endsWith(".jpeg")
    ) {
        return "image/jpeg";
    }

    if (clean.endsWith(".bmp")) {
        return "image/bmp";
    }

    return "";
}


/* =========================================================
   URL LOADING
   ========================================================= */

async function getURLData(url) {

    const response =
        await fetch(url, {
            mode: "cors"
        });

    if (!response.ok) {

        throw new Error(
            "Could not download image. HTTP " +
            response.status
        );
    }

    const blob =
        await response.blob();

    return {
        blob,
        mime:
            blob.type ||
            guessMime(url)
    };
}


/* =========================================================
   INPUT
   ========================================================= */

async function getInputSource() {

    const file =
        fileInput.files[0];

    if (file) {

        return {
            blob: file,
            mime:
                file.type ||
                guessMime(file.name)
        };
    }

    const url =
        imgUrl.value.trim();

    if (!url) {

        throw new Error(
            "Please provide an image URL or choose a file."
        );
    }

    return await getURLData(url);
}


/* =========================================================
   BROWSER IMAGE DECODER
   =========================================================
   
   IMPORTANT:
   
   This intentionally DOES NOT use WebCodecs.
   
   For GIF:
   
   1. We parse the GIF binary ourselves.
   2. We decode the GIF LZW data.
   3. We reconstruct each frame.
   4. We apply disposal methods.
   
   This works on GitHub Pages because it is entirely
   client-side JavaScript.
   ========================================================= */


/* =========================================================
   BYTE READER
   ========================================================= */

class ByteReader {

    constructor(buffer) {

        this.bytes =
            new Uint8Array(buffer);

        this.pos = 0;
    }

    eof() {

        return this.pos >= this.bytes.length;
    }

    readByte() {

        if (this.eof()) {
            throw new Error(
                "Unexpected end of GIF data."
            );
        }

        return this.bytes[this.pos++];
    }

    readUint16() {

        const a =
            this.readByte();

        const b =
            this.readByte();

        return a | (b << 8);
    }

    readBytes(length) {

        if (
            this.pos + length >
            this.bytes.length
        ) {
            throw new Error(
                "Unexpected end of GIF data."
            );
        }

        const result =
            this.bytes.slice(
                this.pos,
                this.pos + length
            );

        this.pos += length;

        return result;
    }

    skip(length) {

        this.pos =
            Math.min(
                this.pos + length,
                this.bytes.length
            );
    }
}


/* =========================================================
   GIF SUB-BLOCKS
   ========================================================= */

function readSubBlocks(reader) {

    const chunks = [];

    let total = 0;

    while (true) {

        const size =
            reader.readByte();

        if (size === 0) {
            break;
        }

        const chunk =
            reader.readBytes(size);

        chunks.push(chunk);

        total += size;
    }

    const output =
        new Uint8Array(total);

    let offset = 0;

    for (const chunk of chunks) {

        output.set(
            chunk,
            offset
        );

        offset += chunk.length;
    }

    return output;
}


/* =========================================================
   GIF LZW DECODER
   ========================================================= */

function decodeGIFLZW(
    compressed,
    minCodeSize,
    expectedPixels
) {

    if (
        minCodeSize < 2 ||
        minCodeSize > 8
    ) {
        throw new Error(
            "Invalid GIF LZW minimum code size: " +
            minCodeSize
        );
    }

    const clearCode =
        1 << minCodeSize;

    const endCode =
        clearCode + 1;

    let codeSize =
        minCodeSize + 1;

    let nextCode =
        endCode + 1;

    const dictionary =
        new Array(4096);

    function resetDictionary() {

        for (
            let i = 0;
            i < clearCode;
            i++
        ) {

            dictionary[i] = [
                i
            ];
        }

        codeSize =
            minCodeSize + 1;

        nextCode =
            endCode + 1;
    }

    resetDictionary();

    let bitPos = 0;

    function readCode() {

        if (
            bitPos +
            codeSize >
            compressed.length * 8
        ) {
            return null;
        }

        let code = 0;

        for (
            let i = 0;
            i < codeSize;
            i++
        ) {

            const byteIndex =
                bitPos >> 3;

            const bitIndex =
                bitPos & 7;

            const bit =
                (
                    compressed[byteIndex] >>
                    bitIndex
                ) & 1;

            code |=
                bit << i;

            bitPos++;
        }

        return code;
    }

    const output =
        new Uint8Array(
            expectedPixels
        );

    let outputPos = 0;

    let previous = null;

    while (
        outputPos <
        expectedPixels
    ) {

        const code =
            readCode();

        if (code === null) {
            break;
        }

        if (code === clearCode) {

            resetDictionary();

            previous = null;

            continue;
        }

        if (code === endCode) {
            break;
        }

        let entry;

        if (
            code < nextCode &&
            dictionary[code]
        ) {

            entry =
                dictionary[code];

        } else if (
            code === nextCode &&
            previous
        ) {

            entry =
                previous.concat(
                    previous[0]
                );

        } else {

            throw new Error(
                "Invalid GIF LZW code."
            );
        }

        for (
            let i = 0;
            i < entry.length &&
            outputPos < expectedPixels;
            i++
        ) {

            output[outputPos++] =
                entry[i];
        }

        if (
            previous &&
            nextCode < 4096
        ) {

            dictionary[nextCode++] =
                previous.concat(
                    entry[0]
                );

            if (
                nextCode ===
                (1 << codeSize) &&
                codeSize < 12
            ) {

                codeSize++;
            }
        }

        previous =
            entry;
    }

    if (
        outputPos <
        expectedPixels
    ) {

        throw new Error(
            "GIF frame LZW data ended before the expected pixels were decoded."
        );
    }

    return output;
}


/* =========================================================
   GIF INTERLACING
   ========================================================= */

function deinterlace(
    indexes,
    width,
    height
) {

    const output =
        new Uint8Array(
            width * height
        );

    const passes = [
        {
            start: 0,
            step: 8
        },
        {
            start: 4,
            step: 8
        },
        {
            start: 2,
            step: 4
        },
        {
            start: 1,
            step: 2
        }
    ];

    let sourceRow = 0;

    for (const pass of passes) {

        for (
            let y = pass.start;
            y < height;
            y += pass.step
        ) {

            if (
                sourceRow >= height
            ) {
                break;
            }

            const srcOffset =
                sourceRow * width;

            const dstOffset =
                y * width;

            output.set(
                indexes.subarray(
                    srcOffset,
                    srcOffset + width
                ),
                dstOffset
            );

            sourceRow++;
        }
    }

    return output;
}


/* =========================================================
   GIF PARSER
   ========================================================= */

async function decodeGIF(
    blob,
    token
) {

    const buffer =
        await blob.arrayBuffer();

    if (
        token !== renderToken
    ) {
        throw new Error(
            "Rendering stopped."
        );
    }

    const reader =
        new ByteReader(buffer);

    const signature =
        String.fromCharCode(
            reader.readByte(),
            reader.readByte(),
            reader.readByte()
        );

    const version =
        String.fromCharCode(
            reader.readByte(),
            reader.readByte(),
            reader.readByte()
        );

    if (
        signature !== "GIF" ||
        (
            version !== "87a" &&
            version !== "89a"
        )
    ) {

        throw new Error(
            "The file is not a valid GIF."
        );
    }

    const canvasWidth =
        reader.readUint16();

    const canvasHeight =
        reader.readUint16();

    if (
        canvasWidth <= 0 ||
        canvasHeight <= 0
    ) {

        throw new Error(
            "Could not determine the GIF dimensions."
        );
    }

    const packed =
        reader.readByte();

    const backgroundColorIndex =
        reader.readByte();

    reader.readByte();

    const globalColorTableFlag =
        (packed & 0x80) !== 0;

    const globalColorTableSize =
        2 **
        ((packed & 0x07) + 1);

    let globalColorTable = null;

    if (globalColorTableFlag) {

        globalColorTable =
            readColorTable(
                reader,
                globalColorTableSize
            );
    }

    const frames = [];

    let pendingGCE = {
        delay: 100,
        disposal: 0,
        transparent: false,
        transparentIndex: 0
    };

    while (!reader.eof()) {

        if (
            token !== renderToken
        ) {

            throw new Error(
                "Rendering stopped."
            );
        }

        const introducer =
            reader.readByte();

        if (introducer === 0x3B) {
            break;
        }

        if (introducer === 0x21) {

            const label =
                reader.readByte();

            if (label === 0xF9) {

                const blockSize =
                    reader.readByte();

                if (blockSize !== 4) {

                    reader.skip(
                        blockSize
                    );

                    readSubBlocks(reader);

                    continue;
                }

                const gcePacked =
                    reader.readByte();

                const delayCs =
                    reader.readUint16();

                const transparentIndex =
                    reader.readByte();

                reader.readByte();

                pendingGCE = {
                    delay:
                        Math.max(
                            20,
                            delayCs * 10
                        ),

                    disposal:
                        (gcePacked >> 2) & 7,

                    transparent:
                        (gcePacked & 1) !== 0,

                    transparentIndex
                };

            } else {

                /*
                 * Comment, application, plain text,
                 * or other extension.
                 */
                readSubBlocks(reader);
            }

            continue;
        }

        if (introducer !== 0x2C) {

            throw new Error(
                "Unknown GIF block: 0x" +
                introducer.toString(16)
            );
        }

        const left =
            reader.readUint16();

        const top =
            reader.readUint16();

        const width =
            reader.readUint16();

        const height =
            reader.readUint16();

        if (
            width <= 0 ||
            height <= 0
        ) {
            continue;
        }

        const imagePacked =
            reader.readByte();

        const localColorTableFlag =
            (imagePacked & 0x80) !== 0;

        const interlaced =
            (imagePacked & 0x40) !== 0;

        const localColorTableSize =
            2 **
            ((imagePacked & 0x07) + 1);

        let colorTable =
            globalColorTable;

        if (localColorTableFlag) {

            colorTable =
                readColorTable(
                    reader,
                    localColorTableSize
                );
        }

        if (!colorTable) {

            throw new Error(
                "GIF frame has no color table."
            );
        }

        const lzwMinCodeSize =
            reader.readByte();

        const compressed =
            readSubBlocks(reader);

        const pixelCount =
            width * height;

        let indexes =
            decodeGIFLZW(
                compressed,
                lzwMinCodeSize,
                pixelCount
            );

        if (interlaced) {

            indexes =
                deinterlace(
                    indexes,
                    width,
                    height
                );
        }

        frames.push({
            left,
            top,
            width,
            height,
            indexes,
            colorTable,
            delay:
                pendingGCE.delay,
            disposal:
                pendingGCE.disposal,
            transparent:
                pendingGCE.transparent,
            transparentIndex:
                pendingGCE.transparentIndex
        });

        pendingGCE = {
            delay: 100,
            disposal: 0,
            transparent: false,
            transparentIndex: 0
        };

        if (
            frames.length >=
            MAX_ANIMATION_FRAMES
        ) {

            showWarning(
                `GIF contains more than ${MAX_ANIMATION_FRAMES} frames. ` +
                `Only the first ${MAX_ANIMATION_FRAMES} frames will be processed.`
            );

            break;
        }

        if (
            frames.length % 5 === 0
        ) {

            setInfo(
                `Parsed ${frames.length} GIF frames...`
            );

            await nextFrame();
        }
    }

    if (!frames.length) {

        throw new Error(
            "The GIF contains no image frames."
        );
    }

    return {
        width: canvasWidth,
        height: canvasHeight,
        backgroundColorIndex,
        globalColorTable,
        frames
    };
}


/* =========================================================
   COLOR TABLE
   ========================================================= */

function readColorTable(
    reader,
    size
) {

    const table =
        new Uint8Array(
            size * 3
        );

    for (
        let i = 0;
        i < table.length;
        i++
    ) {

        table[i] =
            reader.readByte();
    }

    return table;
}


/* =========================================================
   GIF FRAME → RGBA
   ========================================================= */

function renderGIFFrames(
    gif,
    token
) {

    const canvasWidth =
        gif.width;

    const canvasHeight =
        gif.height;

    /*
     * RGBA canvas representing the actual GIF
     * compositing surface.
     */
    let canvas =
        new Uint8ClampedArray(
            canvasWidth *
            canvasHeight *
            4
        );

    /*
     * GIF background is transparent for our purposes.
     */
    canvas.fill(0);

    const renderedFrames = [];

    let previousCanvas = null;

    for (
        let frameIndex = 0;
        frameIndex < gif.frames.length;
        frameIndex++
    ) {

        if (
            token !== renderToken
        ) {

            throw new Error(
                "Rendering stopped."
            );
        }

        const frame =
            gif.frames[frameIndex];

        /*
         * Save canvas if disposal method 3
         * is requested.
         */
        if (
            frame.disposal === 3
        ) {

            previousCanvas =
                new Uint8ClampedArray(
                    canvas
                );

        } else {

            previousCanvas = null;
        }

        /*
         * Draw indexed frame onto canvas.
         */
        for (
            let y = 0;
            y < frame.height;
            y++
        ) {

            const canvasY =
                frame.top + y;

            if (
                canvasY < 0 ||
                canvasY >= canvasHeight
            ) {
                continue;
            }

            for (
                let x = 0;
                x < frame.width;
                x++
            ) {

                const canvasX =
                    frame.left + x;

                if (
                    canvasX < 0 ||
                    canvasX >= canvasWidth
                ) {
                    continue;
                }

                const sourceIndex =
                    y *
                    frame.width +
                    x;

                const paletteIndex =
                    frame.indexes[
                        sourceIndex
                    ];

                if (
                    frame.transparent &&
                    paletteIndex ===
                    frame.transparentIndex
                ) {

                    continue;
                }

                const paletteOffset =
                    paletteIndex * 3;

                if (
                    paletteOffset + 2 >=
                    frame.colorTable.length
                ) {

                    continue;
                }

                const destination =
                    (
                        canvasY *
                        canvasWidth +
                        canvasX
                    ) * 4;

                canvas[destination] =
                    frame.colorTable[
                        paletteOffset
                    ];

                canvas[destination + 1] =
                    frame.colorTable[
                        paletteOffset + 1
                    ];

                canvas[destination + 2] =
                    frame.colorTable[
                        paletteOffset + 2
                    ];

                canvas[destination + 3] =
                    255;
            }
        }

        /*
         * Copy the completed composited frame.
         */
        renderedFrames.push({
            data:
                new Uint8ClampedArray(
                    canvas
                ),

            delay:
                frame.delay
        });

        /*
         * Apply disposal AFTER capturing frame.
         */
        if (frame.disposal === 2) {

            /*
             * Restore the frame rectangle to transparent.
             */
            for (
                let y = 0;
                y < frame.height;
                y++
            ) {

                const canvasY =
                    frame.top + y;

                if (
                    canvasY < 0 ||
                    canvasY >= canvasHeight
                ) {
                    continue;
                }

                for (
                    let x = 0;
                    x < frame.width;
                    x++
                ) {

                    const canvasX =
                        frame.left + x;

                    if (
                        canvasX < 0 ||
                        canvasX >= canvasWidth
                    ) {
                        continue;
                    }

                    const destination =
                        (
                            canvasY *
                            canvasWidth +
                            canvasX
                        ) * 4;

                    canvas[destination] = 0;
                    canvas[destination + 1] = 0;
                    canvas[destination + 2] = 0;
                    canvas[destination + 3] = 0;
                }
            }

        } else if (
            frame.disposal === 3 &&
            previousCanvas
        ) {

            canvas =
                previousCanvas;
        }

        if (
            frameIndex % 5 === 0
        ) {

            showProgress(
                10 +
                (
                    frameIndex /
                    gif.frames.length
                ) * 15
            );

            await nextFrame();
        }
    }

    return renderedFrames;
}


/* =========================================================
   RGBA → IMAGE DATA
   ========================================================= */

function resizeRGBA(
    rgba,
    sourceWidth,
    sourceHeight,
    targetWidth,
    targetHeight
) {

    const sourceCanvas =
        document.createElement("canvas");

    sourceCanvas.width =
        sourceWidth;

    sourceCanvas.height =
        sourceHeight;

    const sourceCtx =
        sourceCanvas.getContext(
            "2d"
        );

    const sourceImageData =
        new ImageData(
            rgba,
            sourceWidth,
            sourceHeight
        );

    sourceCtx.putImageData(
        sourceImageData,
        0,
        0
    );

    const targetCanvas =
        document.createElement("canvas");

    targetCanvas.width =
        targetWidth;

    targetCanvas.height =
        targetHeight;

    const targetCtx =
        targetCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );

    targetCtx.clearRect(
        0,
        0,
        targetWidth,
        targetHeight
    );

    targetCtx.drawImage(
        sourceCanvas,
        0,
        0,
        targetWidth,
        targetHeight
    );

    return targetCtx.getImageData(
        0,
        0,
        targetWidth,
        targetHeight
    );
}


/* =========================================================
   BINARY CHARACTER RENDERING
   ========================================================= */

function drawBinaryImageData(
    imageData,
    asciiWidth,
    asciiHeight,
    token
) {

    const outputWidth =
        asciiWidth *
        CHAR_WIDTH;

    const outputHeight =
        asciiHeight *
        CHAR_HEIGHT;

    previewCanvas.width =
        outputWidth;

    previewCanvas.height =
        outputHeight;

    const ctx =
        previewCanvas.getContext(
            "2d"
        );

    ctx.fillStyle =
        "#000000";

    ctx.fillRect(
        0,
        0,
        outputWidth,
        outputHeight
    );

    ctx.font =
        `${FONT_SIZE}px "Courier New", monospace`;

    ctx.textBaseline =
        "top";

    for (
        let y = 0;
        y < asciiHeight;
        y++
    ) {

        if (
            token !== renderToken
        ) {
            return false;
        }

        for (
            let x = 0;
            x < asciiWidth;
            x++
        ) {

            const index =
                (
                    y *
                    asciiWidth +
                    x
                ) * 4;

            const r =
                imageData.data[index];

            const g =
                imageData.data[index + 1];

            const b =
                imageData.data[index + 2];

            const alpha =
                imageData.data[index + 3];

            /*
             * Only fully transparent pixels are blank.
             */
            if (alpha === 0) {
                continue;
            }

            const gray =
                0.299 * r +
                0.587 * g +
                0.114 * b;

            const char =
                gray < 128
                    ? "1"
                    : "0";

            /*
             * Preserve the original color.
             */
            ctx.fillStyle =
                `rgba(${r},${g},${b},${alpha / 255})`;

            ctx.fillText(
                char,
                x * CHAR_WIDTH,
                y * CHAR_HEIGHT
            );
        }
    }

    return true;
}


/* =========================================================
   GIF FRAME → BINARY CANVAS
   ========================================================= */

async function gifFrameToBinary(
    frame,
    sourceWidth,
    sourceHeight,
    asciiWidth,
    asciiHeight,
    token
) {

    const resized =
        resizeRGBA(
            frame.data,
            sourceWidth,
            sourceHeight,
            asciiWidth,
            asciiHeight
        );

    currentImageData =
        resized;

    currentWidth =
        asciiWidth;

    currentHeight =
        asciiHeight;

    const success =
        drawBinaryImageData(
            resized,
            asciiWidth,
            asciiHeight,
            token
        );

    if (!success) {
        return false;
    }

    fitCanvasToScreen();

    return true;
}


/* =========================================================
   ANIMATED GIF ENCODING
   ========================================================= */

async function encodeGIFFrames(
    frames,
    sourceWidth,
    sourceHeight,
    token
) {

    const resolution =
        calculateResolution(
            sourceWidth,
            sourceHeight,
            qualitySelect.value,
            true
        );

    const asciiWidth =
        resolution.width;

    const asciiHeight =
        resolution.height;

    const outputWidth =
        asciiWidth *
        CHAR_WIDTH;

    const outputHeight =
        asciiHeight *
        CHAR_HEIGHT;

    const gif =
        new GIF({

            workers: 2,

            quality: 10,

            width: outputWidth,

            height: outputHeight,

            workerScript: GIF_WORKER,

            repeat: 0,

            background: "#000000"
        });

    for (
        let i = 0;
        i < frames.length;
        i++
    ) {

        if (
            token !== renderToken
        ) {

            throw new Error(
                "Rendering stopped."
            );
        }

        setInfo(
            `Rendering GIF frame ${i + 1} / ${frames.length}`
        );

        showProgress(
            25 +
            (
                i /
                frames.length
            ) * 55
        );

        const success =
            await gifFrameToBinary(
                frames[i],
                sourceWidth,
                sourceHeight,
                asciiWidth,
                asciiHeight,
                token
            );

        if (!success) {

            throw new Error(
                "Rendering stopped."
            );
        }

        /*
         * GIF delays must be sensible.
         */
        const delay =
            Math.max(
                20,
                Math.round(
                    frames[i].delay || 100
                )
            );

        gif.addFrame(
            previewCanvas,
            {
                copy: true,
                delay
            }
        );

        await nextFrame();
    }

    setInfo(
        "Encoding final GIF..."
    );

    showProgress(82);

    const blob =
        await new Promise(
            (resolve, reject) => {

                gif.on(
                    "finished",
                    result => {
                        resolve(result);
                    }
                );

                gif.on(
                    "abort",
                    () => {

                        reject(
                            new Error(
                                "GIF encoding was aborted."
                            )
                        );
                    }
                );

                gif.on(
                    "error",
                    error => {
                        reject(error);
                    }
                );

                gif.on(
                    "progress",
                    progress => {

                        showProgress(
                            82 +
                            progress * 18
                        );
                    }
                );

                gif.render();
            }
        );

    return {
        blob,
        width: outputWidth,
        height: outputHeight,
        frames: frames.length
    };
}


/* =========================================================
   STATIC IMAGE RENDERING
   ========================================================= */

async function renderStatic(
    blob,
    token
) {

    const bitmap =
        await createImageBitmap(blob);

    if (
        token !== renderToken
    ) {

        bitmap.close();

        return null;
    }

    const sourceWidth =
        bitmap.width;

    const sourceHeight =
        bitmap.height;

    const resolution =
        calculateResolution(
            sourceWidth,
            sourceHeight,
            qualitySelect.value,
            false
        );

    const asciiWidth =
        resolution.width;

    const asciiHeight =
        resolution.height;

    if (
        asciiWidth *
        CHAR_WIDTH *
        asciiHeight *
        CHAR_HEIGHT >
        MAX_OUTPUT_PIXELS
    ) {

        bitmap.close();

        throw new Error(
            "The requested resolution is too large for this browser."
        );
    }

    sourceCanvas.width =
        asciiWidth;

    sourceCanvas.height =
        asciiHeight;

    const ctx =
        sourceCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );

    ctx.clearRect(
        0,
        0,
        asciiWidth,
        asciiHeight
    );

    ctx.drawImage(
        bitmap,
        0,
        0,
        asciiWidth,
        asciiHeight
    );

    bitmap.close();

    const imageData =
        ctx.getImageData(
            0,
            0,
            asciiWidth,
            asciiHeight
        );

    currentImageData =
        imageData;

    currentWidth =
        asciiWidth;

    currentHeight =
        asciiHeight;

    placeholder.style.display =
        "none";

    previewCanvas.width =
        asciiWidth *
        CHAR_WIDTH;

    previewCanvas.height =
        asciiHeight *
        CHAR_HEIGHT;

    const outputCtx =
        previewCanvas.getContext(
            "2d"
        );

    outputCtx.fillStyle =
        "#000000";

    outputCtx.fillRect(
        0,
        0,
        previewCanvas.width,
        previewCanvas.height
    );

    outputCtx.font =
        `${FONT_SIZE}px "Courier New", monospace`;

    outputCtx.textBaseline =
        "top";

    for (
        let row = 0;
        row < asciiHeight;
        row += ROWS_PER_BATCH
    ) {

        if (
            token !== renderToken
        ) {
            return null;
        }

        const end =
            Math.min(
                row + ROWS_PER_BATCH,
                asciiHeight
            );

        for (
            let y = row;
            y < end;
            y++
        ) {

            for (
                let x = 0;
                x < asciiWidth;
                x++
            ) {

                const index =
                    (
                        y *
                        asciiWidth +
                        x
                    ) * 4;

                const r =
                    imageData.data[index];

                const g =
                    imageData.data[index + 1];

                const b =
                    imageData.data[index + 2];

                const alpha =
                    imageData.data[index + 3];

                if (alpha === 0) {
                    continue;
                }

                const gray =
                    0.299 * r +
                    0.587 * g +
                    0.114 * b;

                const char =
                    gray < 128
                        ? "1"
                        : "0";

                outputCtx.fillStyle =
                    `rgba(${r},${g},${b},${alpha / 255})`;

                outputCtx.fillText(
                    char,
                    x * CHAR_WIDTH,
                    y * CHAR_HEIGHT
                );
            }
        }

        showProgress(
            end /
            asciiHeight *
            75
        );

        setInfo(
            `Rendering static image: ` +
            `${Math.floor(
                end /
                asciiHeight *
                100
            )}%`
        );

        await nextFrame();
    }

    fitCanvasToScreen();

    return {
        width: asciiWidth,
        height: asciiHeight
    };
}


/* =========================================================
   SHOW GIF
   ========================================================= */

function showGeneratedGIF(blob) {

    if (currentGifUrl) {

        URL.revokeObjectURL(
            currentGifUrl
        );
    }

    currentGifBlob =
        blob;

    currentGifUrl =
        URL.createObjectURL(
            blob
        );

    gifPreview.src =
        currentGifUrl;

    downloadArea.style.display =
        "block";

    downloadBtn.style.display =
        "inline-block";
}


/* =========================================================
   MAIN PROCESS
   ========================================================= */

async function processImage() {

    renderToken++;

    const token =
        renderToken;

    convertBtn.disabled =
        true;

    stopBtn.style.display =
        "inline-block";

    downloadBtn.style.display =
        "none";

    copyBtn.style.display =
        "none";

    hideError();
    hideWarning();
    hideProgress();

    if (currentGifUrl) {

        URL.revokeObjectURL(
            currentGifUrl
        );

        currentGifUrl = null;
    }

    currentGifBlob = null;

    downloadArea.style.display =
        "none";

    clearOutput();

    try {

        setInfo(
            "Loading image..."
        );

        const input =
            await getInputSource();

        if (
            token !== renderToken
        ) {
            return;
        }

        let mime =
            input.mime ||
            input.blob.type ||
            "";

        /*
         * Detect GIF directly from binary if MIME
         * information is missing or incorrect.
         */
        if (
            !mime ||
            mime === "application/octet-stream"
        ) {

            const header =
                new Uint8Array(
                    await input.blob.slice(
                        0,
                        6
                    ).arrayBuffer()
                );

            if (
                header.length >= 6 &&
                header[0] === 0x47 &&
                header[1] === 0x49 &&
                header[2] === 0x46
            ) {

                mime =
                    "image/gif";
            }
        }

        /*
         * =====================================================
         * GIF
         * =====================================================
         */

        if (mime === "image/gif") {

            setInfo(
                "Parsing GIF..."
            );

            showProgress(2);

            const gif =
                await decodeGIF(
                    input.blob,
                    token
                );

            if (
                token !== renderToken
            ) {
                return;
            }

            setInfo(
                `GIF detected: ` +
                `${gif.width} × ${gif.height}, ` +
                `${gif.frames.length} frame(s)`
            );

            showProgress(15);

            const frames =
                renderGIFFrames(
                    gif,
                    token
                );

            if (
                token !== renderToken
            ) {
                return;
            }

            setInfo(
                `Decoded ${frames.length} GIF frames.`
            );

            const result =
                await encodeGIFFrames(
                    frames,
                    gif.width,
                    gif.height,
                    token
                );

            if (
                token !== renderToken
            ) {
                return;
            }

            showGeneratedGIF(
                result.blob
            );

            setInfo(
                `Complete — GIF → binary GIF | ` +
                `${gif.width} × ${gif.height} source | ` +
                `${currentWidth} × ${currentHeight} character cells | ` +
                `${result.frames} frames`
            );

            copyBtn.style.display =
                "inline-block";

            showProgress(100);

            await sleep(300);

            hideProgress();

            return;
        }


        /*
         * =====================================================
         * WEBP
         * =====================================================
         *
         * Static WebP works through createImageBitmap.
         *
         * Animated WebP cannot be reliably decoded by every
         * browser without WebCodecs or an external decoder.
         *
         * We therefore explicitly explain this instead of
         * falsely pretending that it is an animated GIF.
         */

        if (mime === "image/webp") {

            setInfo(
                "Loading WebP..."
            );

            try {

                const result =
                    await renderStatic(
                        input.blob,
                        token
                    );

                if (
                    !result ||
                    token !== renderToken
                ) {
                    return;
                }

                setInfo(
                    `Complete — WebP → binary GIF | ` +
                    `${result.width} × ` +
                    `${result.height} character cells`
                );

            } catch (webpError) {

                throw new Error(
                    "This browser could not decode the WebP. " +
                    "Static WebP normally works, but animated WebP " +
                    "requires an animated WebP decoder."
                );
            }

        } else {

            /*
             * =================================================
             * STATIC IMAGE
             * =================================================
             */

            const result =
                await renderStatic(
                    input.blob,
                    token
                );

            if (
                !result ||
                token !== renderToken
            ) {
                return;
            }

            setInfo(
                "Encoding static image as GIF..."
            );
        }


        /*
         * =====================================================
         * STATIC → GIF
         * =====================================================
         */

        if (
            token !== renderToken
        ) {
            return;
        }

        /*
         * If the output has not already been generated,
         * encode the current preview as a one-frame GIF.
         */
        if (!currentGifBlob) {

            const gif =
                new GIF({

                    workers: 2,

                    quality: 10,

                    width:
                        previewCanvas.width,

                    height:
                        previewCanvas.height,

                    workerScript:
                        GIF_WORKER,

                    repeat: 0,

                    background:
                        "#000000"
                });

            gif.addFrame(
                previewCanvas,
                {
                    copy: true,
                    delay: 1000
                }
            );

            const blob =
                await new Promise(
                    (resolve, reject) => {

                        gif.on(
                            "finished",
                            resolve
                        );

                        gif.on(
                            "error",
                            reject
                        );

                        gif.on(
                            "progress",
                            progress => {

                                showProgress(
                                    80 +
                                    progress * 20
                                );
                            }
                        );

                        gif.render();
                    }
                );

            if (
                token !== renderToken
            ) {
                return;
            }

            showGeneratedGIF(
                blob
            );
        }

        copyBtn.style.display =
            "inline-block";

        showProgress(100);

        await sleep(300);

        hideProgress();

    } catch (err) {

        console.error(
            "Binary GIF conversion error:",
            err
        );

        if (
            token !== renderToken
        ) {
            return;
        }

        showError(
            err && err.message
                ? err.message
                : "Something went wrong while processing the image."
        );

        setInfo(
            "Processing failed."
        );

        hideProgress();

    } finally {

        if (
            token === renderToken
        ) {

            convertBtn.disabled =
                false;

            stopBtn.style.display =
                "none";
        }
    }
}


/* =========================================================
   STOP
   ========================================================= */

function stopRendering() {

    renderToken++;

    setInfo(
        "Rendering stopped."
    );

    convertBtn.disabled =
        false;

    stopBtn.style.display =
        "none";

    hideProgress();
}


/* =========================================================
   DOWNLOAD
   ========================================================= */

function downloadGIF() {

    if (
        !currentGifBlob ||
        !currentGifUrl
    ) {
        return;
    }

    const a =
        document.createElement("a");

    a.href =
        currentGifUrl;

    a.download =
        "binary-art.gif";

    document.body.appendChild(a);

    a.click();

    a.remove();
}


/* =========================================================
   COPY CURRENT FRAME
   ========================================================= */

async function copyCurrentFrame() {

    if (
        !currentImageData ||
        currentWidth <= 0 ||
        currentHeight <= 0
    ) {
        return;
    }

    const lines = [];

    for (
        let y = 0;
        y < currentHeight;
        y++
    ) {

        let line = "";

        for (
            let x = 0;
            x < currentWidth;
            x++
        ) {

            const index =
                (
                    y *
                    currentWidth +
                    x
                ) * 4;

            const alpha =
                currentImageData.data[
                    index + 3
                ];

            if (alpha === 0) {

                line += " ";

                continue;
            }

            const r =
                currentImageData.data[index];

            const g =
                currentImageData.data[
                    index + 1
                ];

            const b =
                currentImageData.data[
                    index + 2
                ];

            const gray =
                0.299 * r +
                0.587 * g +
                0.114 * b;

            line +=
                gray < 128
                    ? "1"
                    : "0";
        }

        lines.push(line);
    }

    try {

        await navigator.clipboard.writeText(
            lines.join("\n")
        );

        setInfo(
            "Current frame copied as text."
        );

    } catch (err) {

        /*
         * Fallback for browsers where clipboard API
         * is unavailable.
         */
        const textarea =
            document.createElement("textarea");

        textarea.value =
            lines.join("\n");

        textarea.style.position =
            "fixed";

        textarea.style.left =
            "-9999px";

        document.body.appendChild(
            textarea
        );

        textarea.select();

        try {

            document.execCommand(
                "copy"
            );

            setInfo(
                "Current frame copied as text."
            );

        } catch (copyError) {

            showError(
                "Clipboard access failed."
            );

        }

        textarea.remove();
    }
}


/* =========================================================
   EVENTS
   ========================================================= */

window.addEventListener(
    "resize",
    fitCanvasToScreen
);


convertBtn.addEventListener(
    "click",
    processImage
);


stopBtn.addEventListener(
    "click",
    stopRendering
);


downloadBtn.addEventListener(
    "click",
    downloadGIF
);


copyBtn.addEventListener(
    "click",
    copyCurrentFrame
);


imgUrl.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            processImage();
        }
    }
);


fileInput.addEventListener(
    "change",
    () => {

        if (
            fileInput.files.length
        ) {

            imgUrl.value = "";

            setInfo(
                `Selected: ${fileInput.files[0].name}`
            );
        }
    }
);


/* =========================================================
   INITIAL STATE
   ========================================================= */

clearOutput();

</script>

</body>
</html>
