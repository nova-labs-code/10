<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Colored Binary GIF / WebP to GIF</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        background: #121212;
        color: #e0e0e0;
        padding: 20px;
        max-width: 1400px;
        margin: auto;
    }

    h2 {
        color: #4fc3f7;
        margin-top: 0;
    }

    .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
        flex-wrap: wrap;
    }

    input[type="text"] {
        flex: 1;
        padding: 10px;
        border-radius: 4px;
        border: 1px solid #333;
        background: #1e1e1e;
        color: white;
        min-width: 280px;
        outline: none;
        font-size: 14px;
    }

    input[type="text"]:focus {
        border-color: #0288d1;
    }

    input[type="file"] {
        color: #ddd;
        max-width: 300px;
    }

    select,
    button {
        padding: 10px 15px;
        border-radius: 4px;
        border: none;
        background: #0288d1;
        color: white;
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
    }

    select {
        min-width: 230px;
    }

    button:hover {
        background: #0277bd;
    }

    button:disabled {
        opacity: .5;
        cursor: not-allowed;
    }

    #stopBtn {
        display: none;
        background: #c62828;
    }

    #stopBtn:hover {
        background: #b71c1c;
    }

    #downloadBtn {
        display: none;
        background: #2e7d32;
    }

    #downloadBtn:hover {
        background: #1b5e20;
    }

    #copyBtn {
        display: none;
        background: #6a1b9a;
    }

    #info {
        color: #aaa;
        font-size: 13px;
        margin: 8px 0 12px;
        line-height: 1.5;
    }

    #warning {
        display: none;
        background: #4a3200;
        border: 1px solid #9a6b00;
        color: #ffd666;
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 12px;
        line-height: 1.4;
    }

    #error {
        display: none;
        background: #4a1010;
        border: 1px solid #a52a2a;
        color: #ffaaaa;
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 12px;
        line-height: 1.4;
        white-space: pre-wrap;
    }

    #progressContainer {
        display: none;
        width: 100%;
        height: 7px;
        background: #222;
        border-radius: 4px;
        margin-bottom: 12px;
        overflow: hidden;
    }

    #progressBar {
        height: 100%;
        width: 0%;
        background: #03a9f4;
        transition: width .05s linear;
    }

    #outputWrapper {
        background: #000;
        border: 1px solid #333;
        border-radius: 6px;
        overflow: auto;
        padding: 15px;
        max-width: 100%;
    }

    #canvasContainer {
        width: 100%;
        overflow: hidden;
        background: #000;
    }

    #previewCanvas {
        display: block;
        background: #000;
        image-rendering: auto;
        max-width: none;
    }

    #placeholder {
        color: #777;
        font-family: "Courier New", monospace;
        white-space: pre-wrap;
    }

    #downloadArea {
        margin-top: 15px;
        display: none;
    }

    #gifPreview {
        max-width: 100%;
        height: auto;
        background: #000;
        border: 1px solid #333;
    }

    #sourceCanvas,
    #frameCanvas,
    #gifCompositeCanvas {
        display: none;
    }

    .small {
        color: #888;
        font-size: 12px;
        margin-top: 8px;
    }
</style>
</head>

<body>

<h2>Image → Colored 1 / 0 Animated GIF</h2>

<div class="controls">

    <input
        type="text"
        id="imgUrl"
        placeholder="Paste image / GIF / WebP URL..."
    >

    <input
        type="file"
        id="fileInput"
        accept="image/*,.gif,.webp"
    >

    <select id="qualitySelect">

        <option value="35">
            Low — 35 characters wide
        </option>

        <option value="80" selected>
            Medium — 80 characters wide
        </option>

        <option value="150">
            High — 150 characters wide
        </option>

        <option value="300">
            Ultra — 300 characters wide
        </option>

        <option value="600">
            Extreme — 600 characters wide
        </option>

        <option value="1200">
            ⚡ HYPER — 1200 characters wide
        </option>

    </select>

    <button id="convertBtn">
        Convert
    </button>

    <button id="stopBtn">
        Stop
    </button>

    <button id="downloadBtn">
        Download GIF
    </button>

    <button id="copyBtn">
        Copy Frame
    </button>

</div>

<div id="info">
    Loading decoder libraries...
</div>

<div id="warning"></div>

<div id="error"></div>

<div id="progressContainer">
    <div id="progressBar"></div>
</div>

<div id="outputWrapper">

    <div id="canvasContainer">

        <div id="placeholder">
            Paste an image/GIF/WebP URL or choose a file above.
        </div>

        <canvas id="previewCanvas"></canvas>

    </div>

</div>

<div id="downloadArea">

    <h3>Generated GIF</h3>

    <img
        id="gifPreview"
        alt="Generated GIF"
    >

    <div class="small">
        The GIF above is the actual generated binary GIF.
    </div>

</div>

<canvas id="sourceCanvas"></canvas>
<canvas id="frameCanvas"></canvas>
<canvas id="gifCompositeCanvas"></canvas>


<!--
    GIF DECODER

    gifuct-js is used ONLY for decoding input GIF files.

    We capture its global before loading gif.js because both
    libraries can use the global name "GIF".
-->
<script src="https://unpkg.com/gifuct-js@1.0.0/dist/gifuct-js.min.js"></script>

<script>
    /*
     * Save gifuct-js before gif.js loads.
     */
    window.GIFDecoder = window.GIF;
</script>


<!--
    GIF ENCODER
-->
<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>


<script>

"use strict";


/* =========================================================
   CONFIGURATION
   ========================================================= */

const CHAR_WIDTH = 6;
const CHAR_HEIGHT = 10;
const FONT_SIZE = 10;


/*
 * Animated output source resolution.
 */
const ANIMATED_MAX_WIDTH = 150;
const ANIMATED_MAX_HEIGHT = 150;


/*
 * Maximum number of frames processed.
 */
const MAX_ANIMATION_FRAMES = 300;


/*
 * Static rendering batch size.
 */
const ROWS_PER_BATCH = 1000;


/*
 * Maximum rendered canvas pixel count.
 */
const MAX_OUTPUT_PIXELS = 160000000;


/*
 * Don't visually shrink below this amount.
 */
const MIN_DISPLAY_SCALE = 0.20;


/*
 * gif.js worker source.
 *
 * We fetch this and turn it into a Blob URL so that
 * the worker is same-origin from the browser's point
 * of view.
 */
const GIF_WORKER_URL =
    "https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js";


/* =========================================================
   ELEMENTS
   ========================================================= */

const imgUrl =
    document.getElementById("imgUrl");

const fileInput =
    document.getElementById("fileInput");

const qualitySelect =
    document.getElementById("qualitySelect");

const convertBtn =
    document.getElementById("convertBtn");

const stopBtn =
    document.getElementById("stopBtn");

const downloadBtn =
    document.getElementById("downloadBtn");

const copyBtn =
    document.getElementById("copyBtn");

const info =
    document.getElementById("info");

const warning =
    document.getElementById("warning");

const errorBox =
    document.getElementById("error");

const progressContainer =
    document.getElementById("progressContainer");

const progressBar =
    document.getElementById("progressBar");

const outputWrapper =
    document.getElementById("outputWrapper");

const previewCanvas =
    document.getElementById("previewCanvas");

const placeholder =
    document.getElementById("placeholder");

const gifPreview =
    document.getElementById("gifPreview");

const downloadArea =
    document.getElementById("downloadArea");

const sourceCanvas =
    document.getElementById("sourceCanvas");

const frameCanvas =
    document.getElementById("frameCanvas");

const gifCompositeCanvas =
    document.getElementById("gifCompositeCanvas");


/* =========================================================
   STATE
   ========================================================= */

let renderToken = 0;

let currentGifBlob = null;

let currentGifUrl = null;

let currentWidth = 0;

let currentHeight = 0;

let currentImageData = null;

let gifWorkerBlobUrl = null;

let gifWorkerReady = false;


/* =========================================================
   GENERAL HELPERS
   ========================================================= */

function nextFrame() {

    return new Promise(resolve => {

        requestAnimationFrame(resolve);

    });
}


function sleep(ms) {

    return new Promise(resolve => {

        setTimeout(resolve, ms);

    });
}


function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(max, value)
    );
}


function setInfo(text) {

    info.textContent =
        text;
}


function showError(text) {

    errorBox.textContent =
        text;

    errorBox.style.display =
        "block";
}


function hideError() {

    errorBox.textContent =
        "";

    errorBox.style.display =
        "none";
}


function showWarning(text) {

    warning.textContent =
        text;

    warning.style.display =
        "block";
}


function hideWarning() {

    warning.textContent =
        "";

    warning.style.display =
        "none";
}


function showProgress(percent) {

    progressContainer.style.display =
        "block";

    progressBar.style.width =
        clamp(
            percent,
            0,
            100
        ) + "%";
}


function hideProgress() {

    progressContainer.style.display =
        "none";

    progressBar.style.width =
        "0%";
}


/* =========================================================
   LIBRARY CHECK
   ========================================================= */

function checkLibraries() {

    if (
        typeof window.GIFDecoder !==
        "function"
    ) {

        throw new Error(
            "GIF decoder library failed to load. " +
            "Check your GitHub Pages internet connection."
        );
    }

    if (
        typeof window.GIF !==
        "function"
    ) {

        throw new Error(
            "GIF encoder library failed to load."
        );
    }
}


/* =========================================================
   GIF WORKER
   ========================================================= */

async function prepareGifWorker() {

    if (
        gifWorkerReady &&
        gifWorkerBlobUrl
    ) {

        return gifWorkerBlobUrl;
    }

    setInfo(
        "Preparing GIF encoder..."
    );

    const response =
        await fetch(
            GIF_WORKER_URL
        );

    if (
        !response.ok
    ) {

        throw new Error(
            "Could not load the GIF encoder worker. " +
            "HTTP " +
            response.status
        );
    }

    const workerText =
        await response.text();

    const workerBlob =
        new Blob(
            [workerText],
            {
                type:
                    "application/javascript"
            }
        );

    gifWorkerBlobUrl =
        URL.createObjectURL(
            workerBlob
        );

    gifWorkerReady =
        true;

    return gifWorkerBlobUrl;
}


/* =========================================================
   CLEAR OUTPUT
   ========================================================= */

function clearOutput() {

    previewCanvas.width = 1;
    previewCanvas.height = 1;

    previewCanvas.style.width =
        "1px";

    previewCanvas.style.height =
        "1px";

    placeholder.style.display =
        "block";

    currentImageData =
        null;

    currentWidth =
        0;

    currentHeight =
        0;
}


/* =========================================================
   FIT PREVIEW
   ========================================================= */

function fitCanvasToScreen() {

    if (
        previewCanvas.width <= 1 ||
        previewCanvas.height <= 1
    ) {

        return;
    }

    const availableWidth =
        Math.max(
            1,
            outputWrapper.clientWidth - 30
        );

    const naturalWidth =
        previewCanvas.width;

    let scale =
        Math.min(
            1,
            availableWidth /
            naturalWidth
        );

    if (
        scale <
        MIN_DISPLAY_SCALE
    ) {

        scale =
            MIN_DISPLAY_SCALE;
    }

    previewCanvas.style.width =
        Math.round(
            naturalWidth *
            scale
        ) + "px";

    previewCanvas.style.height =
        Math.round(
            previewCanvas.height *
            scale
        ) + "px";

    previewCanvas.dataset.scale =
        scale;
}


/* =========================================================
   MIME
   ========================================================= */

function normalizeMime(type) {

    if (!type) {
        return "";
    }

    return type
        .toLowerCase()
        .split(";")[0]
        .trim();
}


function guessMime(url) {

    if (!url) {
        return "";
    }

    const clean =
        url
            .split("?")[0]
            .split("#")[0]
            .toLowerCase();

    if (
        clean.endsWith(".gif")
    ) {

        return "image/gif";
    }

    if (
        clean.endsWith(".webp")
    ) {

        return "image/webp";
    }

    if (
        clean.endsWith(".png")
    ) {

        return "image/png";
    }

    if (
        clean.endsWith(".jpg") ||
        clean.endsWith(".jpeg")
    ) {

        return "image/jpeg";
    }

    return "";
}


/* =========================================================
   BYTE TYPE DETECTION
   ========================================================= */

function detectMimeFromBytes(
    buffer
) {

    const bytes =
        new Uint8Array(buffer);

    /*
     * GIF87a / GIF89a
     */
    if (
        bytes.length >= 6
    ) {

        const signature =
            String.fromCharCode(
                bytes[0],
                bytes[1],
                bytes[2],
                bytes[3],
                bytes[4],
                bytes[5]
            );

        if (
            signature === "GIF87a" ||
            signature === "GIF89a"
        ) {

            return "image/gif";
        }
    }

    /*
     * RIFF....WEBP
     */
    if (
        bytes.length >= 12
    ) {

        const riff =
            String.fromCharCode(
                bytes[0],
                bytes[1],
                bytes[2],
                bytes[3]
            );

        const webp =
            String.fromCharCode(
                bytes[8],
                bytes[9],
                bytes[10],
                bytes[11]
            );

        if (
            riff === "RIFF" &&
            webp === "WEBP"
        ) {

            return "image/webp";
        }
    }

    return "";
}


/* =========================================================
   INPUT SOURCE
   ========================================================= */

async function getInputSource() {

    const file =
        fileInput.files[0];

    if (file) {

        let mime =
            normalizeMime(
                file.type
            );

        if (
            !mime ||
            mime ===
                "application/octet-stream"
        ) {

            mime =
                guessMime(
                    file.name
                );
        }

        return {
            blob: file,
            mime
        };
    }

    const url =
        imgUrl.value.trim();

    if (!url) {

        throw new Error(
            "Please provide an image URL or choose a file."
        );
    }

    const response =
        await fetch(
            url,
            {
                mode: "cors"
            }
        );

    if (
        !response.ok
    ) {

        throw new Error(
            "Could not download image. HTTP " +
            response.status +
            ". The remote site may block CORS."
        );
    }

    const blob =
        await response.blob();

    let mime =
        normalizeMime(
            blob.type
        );

    if (
        !mime ||
        mime ===
            "application/octet-stream"
    ) {

        mime =
            guessMime(url);
    }

    return {
        blob,
        mime
    };
}


/* =========================================================
   RESOLUTION
   ========================================================= */

function calculateResolution(
    sourceWidth,
    sourceHeight,
    quality,
    animated
) {

    let width;

    if (
        animated
    ) {

        width =
            Math.min(
                sourceWidth,
                ANIMATED_MAX_WIDTH
            );

    } else if (
        quality === "1200"
    ) {

        width =
            sourceWidth;

    } else {

        width =
            Math.min(
                parseInt(
                    quality,
                    10
                ),
                sourceWidth
            );
    }

    const imageRatio =
        sourceHeight /
        sourceWidth;

    const characterCorrection =
        CHAR_WIDTH /
        CHAR_HEIGHT;

    let height =
        Math.max(
            1,
            Math.round(
                width *
                imageRatio *
                characterCorrection
            )
        );

    if (
        animated &&
        height >
            ANIMATED_MAX_HEIGHT
    ) {

        const scale =
            ANIMATED_MAX_HEIGHT /
            height;

        height =
            ANIMATED_MAX_HEIGHT;

        width =
            Math.max(
                1,
                Math.round(
                    width *
                    scale
                )
            );
    }

    return {
        width,
        height
    };
}


/* =========================================================
   GIF FRAME COMPOSITING
   =========================================================

   GIF frames can be partial rectangles.

   This function reconstructs the COMPLETE GIF frame
   using disposal rules before sending it to the binary
   renderer.
   ========================================================= */

function createGifCompositor(
    width,
    height
) {

    gifCompositeCanvas.width =
        width;

    gifCompositeCanvas.height =
        height;

    const ctx =
        gifCompositeCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );

    /*
     * Transparent initial canvas.
     */
    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    return {
        canvas: gifCompositeCanvas,
        ctx
    };
}


function drawGifPatch(
    ctx,
    frame
) {

    const dims =
        frame.dims;

    const patch =
        frame.patch;

    if (
        !patch ||
        !dims
    ) {

        return;
    }

    const imageData =
        new ImageData(
            patch,
            dims.width,
            dims.height
        );

    ctx.putImageData(
        imageData,
        dims.left,
        dims.top
    );
}


/* =========================================================
   GIF DECODER
   ========================================================= */

async function decodeGif(
    blob,
    token
) {

    checkLibraries();

    const buffer =
        await blob.arrayBuffer();

    if (
        token !== renderToken
    ) {

        throw new Error(
            "Rendering stopped."
        );
    }

    /*
     * gifuct-js expects an ArrayBuffer and provides
     * parseGIF() + decompressFrames().
     */
    const parsed =
        window.GIFDecoder.parseGIF(
            buffer
        );

    let frames =
        window.GIFDecoder.decompressFrames(
            parsed,
            true
        );

    if (
        !frames ||
        !frames.length
    ) {

        throw new Error(
            "The GIF contains no decodable frames."
        );
    }

    const sourceWidth =
        parsed.lsd.width;

    const sourceHeight =
        parsed.lsd.height;

    /*
     * Limit animation length.
     */
    if (
        frames.length >
        MAX_ANIMATION_FRAMES
    ) {

        frames =
            frames.slice(
                0,
                MAX_ANIMATION_FRAMES
            );

        showWarning(
            `This GIF contains more than ` +
            `${MAX_ANIMATION_FRAMES} frames. ` +
            `Only the first ${MAX_ANIMATION_FRAMES} frames will be converted.`
        );
    }

    return {
        frames,
        sourceWidth,
        sourceHeight
    };
}


/* =========================================================
   RESIZE IMAGE DATA
   ========================================================= */

function resizeImageDataToCanvas(
    imageData,
    sourceWidth,
    sourceHeight,
    targetWidth,
    targetHeight
) {

    frameCanvas.width =
        targetWidth;

    frameCanvas.height =
        targetHeight;

    const sourceCanvas2 =
        document.createElement(
            "canvas"
        );

    sourceCanvas2.width =
        sourceWidth;

    sourceCanvas2.height =
        sourceHeight;

    const sourceCtx =
        sourceCanvas2.getContext(
            "2d"
        );

    sourceCtx.putImageData(
        imageData,
        0,
        0
    );

    const ctx =
        frameCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );

    ctx.clearRect(
        0,
        0,
        targetWidth,
        targetHeight
    );

    ctx.drawImage(
        sourceCanvas2,
        0,
        0,
        targetWidth,
        targetHeight
    );

    return ctx.getImageData(
        0,
        0,
        targetWidth,
        targetHeight
    );
}


/* =========================================================
   BINARY RENDER
   ========================================================= */

function renderBinaryFrame(
    imageData,
    asciiWidth,
    asciiHeight,
    token
) {

    const outputWidth =
        asciiWidth *
        CHAR_WIDTH;

    const outputHeight =
        asciiHeight *
        CHAR_HEIGHT;

    previewCanvas.width =
        outputWidth;

    previewCanvas.height =
        outputHeight;

    const ctx =
        previewCanvas.getContext(
            "2d"
        );

    ctx.fillStyle =
        "#000000";

    ctx.fillRect(
        0,
        0,
        outputWidth,
        outputHeight
    );

    ctx.font =
        `${FONT_SIZE}px "Courier New", monospace`;

    ctx.textBaseline =
        "top";

    for (
        let y = 0;
        y < asciiHeight;
        y++
    ) {

        if (
            token !== renderToken
        ) {

            return false;
        }

        for (
            let x = 0;
            x < asciiWidth;
            x++
        ) {

            const index =
                (
                    y *
                    asciiWidth +
                    x
                ) * 4;

            const r =
                imageData.data[
                    index
                ];

            const g =
                imageData.data[
                    index + 1
                ];

            const b =
                imageData.data[
                    index + 2
                ];

            const alpha =
                imageData.data[
                    index + 3
                ];

            /*
             * Only completely transparent pixels
             * become blank.
             */
            if (
                alpha === 0
            ) {

                continue;
            }

            const gray =
                0.299 * r +
                0.587 * g +
                0.114 * b;

            /*
             * Every visible pixel becomes
             * either 1 or 0.
             */
            const char =
                gray < 128
                    ? "1"
                    : "0";

            ctx.fillStyle =
                `rgba(${r},${g},${b},${alpha / 255})`;

            ctx.fillText(
                char,
                x * CHAR_WIDTH,
                y * CHAR_HEIGHT
            );
        }
    }

    return true;
}


/* =========================================================
   RENDER GIF FRAME
   ========================================================= */

async function renderGifFrame(
    compositor,
    frame,
    asciiWidth,
    asciiHeight,
    sourceWidth,
    sourceHeight,
    token
) {

    const ctx =
        compositor.ctx;

    /*
     * Save the canvas BEFORE drawing.
     *
     * Needed for disposal method 3.
     */
    let previousFrame = null;

    if (
        frame.disposalType === 3
    ) {

        previousFrame =
            ctx.getImageData(
                0,
                0,
                sourceWidth,
                sourceHeight
            );
    }

    /*
     * Draw the GIF patch onto the complete
     * GIF canvas.
     */
    drawGifPatch(
        ctx,
        frame
    );

    /*
     * Grab complete composited frame.
     */
    const completeFrame =
        ctx.getImageData(
            0,
            0,
            sourceWidth,
            sourceHeight
        );

    /*
     * Resize to character resolution.
     */
    const resized =
        resizeImageDataToCanvas(
            completeFrame,
            sourceWidth,
            sourceHeight,
            asciiWidth,
            asciiHeight
        );

    currentImageData =
        resized;

    currentWidth =
        asciiWidth;

    currentHeight =
        asciiHeight;

    /*
     * Render binary image.
     */
    const success =
        renderBinaryFrame(
            resized,
            asciiWidth,
            asciiHeight,
            token
        );

    if (!success) {
        return false;
    }

    placeholder.style.display =
        "none";

    fitCanvasToScreen();

    /*
     * Apply GIF disposal.
     *
     * 0 / 1:
     * Keep current canvas.
     *
     * 2:
     * Clear the frame rectangle.
     *
     * 3:
     * Restore the canvas from before
     * this frame.
     */
    if (
        frame.disposalType === 2
    ) {

        const dims =
            frame.dims;

        ctx.clearRect(
            dims.left,
            dims.top,
            dims.width,
            dims.height
        );

    } else if (
        frame.disposalType === 3 &&
        previousFrame
    ) {

        ctx.putImageData(
            previousFrame,
            0,
            0
        );
    }

    return true;
}


/* =========================================================
   GIF ENCODING
   ========================================================= */

async function encodeFrames(
    frameCanvases,
    delays,
    width,
    height,
    token
) {

    const workerScript =
        await prepareGifWorker();

    const gif =
        new GIF({
            workers: 2,
            quality: 10,
            width,
            height,
            workerScript,
            repeat: 0,
            background: "#000000"
        });

    for (
        let i = 0;
        i < frameCanvases.length;
        i++
    ) {

        if (
            token !== renderToken
        ) {

            throw new Error(
                "Rendering stopped."
            );
        }

        let delay =
            Number(
                delays[i]
            );

        if (
            !Number.isFinite(delay) ||
            delay <= 0
        ) {

            delay = 100;
        }

        /*
         * Browsers/GIFs sometimes use extremely
         * small delays. Keep a sensible minimum.
         */
        delay =
            Math.max(
                20,
                Math.round(delay)
            );

        gif.addFrame(
            frameCanvases[i],
            {
                copy: true,
                delay
            }
        );

        showProgress(
            75 +
            (
                (i + 1) /
                frameCanvases.length
            ) * 15
        );

        await nextFrame();
    }

    setInfo(
        "Encoding final GIF..."
    );

    showProgress(92);

    const blob =
        await new Promise(
            (resolve, reject) => {

                let finished =
                    false;

                gif.on(
                    "finished",
                    function(result) {

                        finished =
                            true;

                        resolve(result);
                    }
                );

                gif.on(
                    "abort",
                    function() {

                        if (
                            !finished
                        ) {

                            reject(
                                new Error(
                                    "GIF encoding was aborted."
                                )
                            );
                        }
                    }
                );

                gif.on(
                    "error",
                    function(err) {

                        if (
                            !finished
                        ) {

                            reject(
                                err instanceof Error
                                    ? err
                                    : new Error(
                                        String(err)
                                    )
                            );
                        }
                    }
                );

                gif.on(
                    "progress",
                    function(progress) {

                        showProgress(
                            92 +
                            progress * 8
                        );
                    }
                );

                gif.render();
            }
        );

    return blob;
}


/* =========================================================
   ANIMATED GIF
   ========================================================= */

async function processGif(
    blob,
    token
) {

    setInfo(
        "Reading GIF..."
    );

    showProgress(5);

    const decoded =
        await decodeGif(
            blob,
            token
        );

    const sourceWidth =
        decoded.sourceWidth;

    const sourceHeight =
        decoded.sourceHeight;

    const frames =
        decoded.frames;

    /*
     * Determine output character resolution.
     */
    const resolution =
        calculateResolution(
            sourceWidth,
            sourceHeight,
            qualitySelect.value,
            true
        );

    const asciiWidth =
        resolution.width;

    const asciiHeight =
        resolution.height;

    const outputWidth =
        asciiWidth *
        CHAR_WIDTH;

    const outputHeight =
        asciiHeight *
        CHAR_HEIGHT;

    const outputPixels =
        outputWidth *
        outputHeight;

    if (
        outputPixels >
        MAX_OUTPUT_PIXELS
    ) {

        throw new Error(
            "Animated output is too large."
        );
    }

    currentWidth =
        asciiWidth;

    currentHeight =
        asciiHeight;

    /*
     * Reconstruct full GIF frames.
     */
    const compositor =
        createGifCompositor(
            sourceWidth,
            sourceHeight
        );

    const outputFrames = [];

    const delays = [];

    for (
        let i = 0;
        i < frames.length;
        i++
    ) {

        if (
            token !== renderToken
        ) {

            throw new Error(
                "Rendering stopped."
            );
        }

        const frame =
            frames[i];

        setInfo(
            `Rendering GIF frame ` +
            `${i + 1} / ${frames.length}`
        );

        showProgress(
            10 +
            (
                i /
                frames.length
            ) * 65
        );

        /*
         * Render the complete composited frame.
         */
        const success =
            await renderGifFrame(
                compositor,
                frame,
                asciiWidth,
                asciiHeight,
                sourceWidth,
                sourceHeight,
                token
            );

        if (!success) {

            throw new Error(
                "Rendering stopped."
            );
        }

        /*
         * IMPORTANT:
         *
         * gif.js needs its own copy because
         * previewCanvas changes on every frame.
         */
        const savedCanvas =
            document.createElement(
                "canvas"
            );

        savedCanvas.width =
            previewCanvas.width;

        savedCanvas.height =
            previewCanvas.height;

        const savedCtx =
            savedCanvas.getContext(
                "2d"
            );

        savedCtx.drawImage(
            previewCanvas,
            0,
            0
        );

        outputFrames.push(
            savedCanvas
        );

        /*
         * gifuct-js gives delay in milliseconds.
         */
        let delay =
            Number(
                frame.delay
            );

        if (
            !Number.isFinite(delay) ||
            delay <= 0
        ) {

            delay = 100;
        }

        delays.push(
            delay
        );

        await nextFrame();
    }

    /*
     * Encode all converted frames.
     */
    const blob =
        await encodeFrames(
            outputFrames,
            delays,
            outputWidth,
            outputHeight,
            token
        );

    return {
        blob,
        sourceWidth,
        sourceHeight,
        asciiWidth,
        asciiHeight,
        frames: frames.length
    };
}


/* =========================================================
   STATIC IMAGE
   ========================================================= */

async function processStatic(
    blob,
    token
) {

    setInfo(
        "Loading image..."
    );

    showProgress(5);

    const bitmap =
        await createImageBitmap(
            blob
        );

    if (
        token !== renderToken
    ) {

        bitmap.close();

        throw new Error(
            "Rendering stopped."
        );
    }

    const sourceWidth =
        bitmap.width;

    const sourceHeight =
        bitmap.height;

    const resolution =
        calculateResolution(
            sourceWidth,
            sourceHeight,
            qualitySelect.value,
            false
        );

    const asciiWidth =
        resolution.width;

    const asciiHeight =
        resolution.height;

    const outputWidth =
        asciiWidth *
        CHAR_WIDTH;

    const outputHeight =
        asciiHeight *
        CHAR_HEIGHT;

    const outputPixels =
        outputWidth *
        outputHeight;

    if (
        outputPixels >
        MAX_OUTPUT_PIXELS
    ) {

        bitmap.close();

        throw new Error(
            "The requested resolution is too large for this browser."
        );
    }

    sourceCanvas.width =
        asciiWidth;

    sourceCanvas.height =
        asciiHeight;

    const sourceCtx =
        sourceCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );

    sourceCtx.clearRect(
        0,
        0,
        asciiWidth,
        asciiHeight
    );

    sourceCtx.drawImage(
        bitmap,
        0,
        0,
        asciiWidth,
        asciiHeight
    );

    bitmap.close();

    const imageData =
        sourceCtx.getImageData(
            0,
            0,
            asciiWidth,
            asciiHeight
        );

    currentImageData =
        imageData;

    currentWidth =
        asciiWidth;

    currentHeight =
        asciiHeight;

    previewCanvas.width =
        outputWidth;

    previewCanvas.height =
        outputHeight;

    const ctx =
        previewCanvas.getContext(
            "2d"
        );

    ctx.fillStyle =
        "#000000";

    ctx.fillRect(
        0,
        0,
        outputWidth,
        outputHeight
    );

    ctx.font =
        `${FONT_SIZE}px "Courier New", monospace`;

    ctx.textBaseline =
        "top";

    placeholder.style.display =
        "none";

    let row =
        0;

    while (
        row <
        asciiHeight
    ) {

        if (
            token !== renderToken
        ) {

            throw new Error(
                "Rendering stopped."
            );
        }

        const end =
            Math.min(
                row +
                ROWS_PER_BATCH,
                asciiHeight
            );

        for (
            let y = row;
            y < end;
            y++
        ) {

            for (
                let x = 0;
                x < asciiWidth;
                x++
            ) {

                const index =
                    (
                        y *
                        asciiWidth +
                        x
                    ) * 4;

                const r =
                    imageData.data[
                        index
                    ];

                const g =
                    imageData.data[
                        index + 1
                    ];

                const b =
                    imageData.data[
                        index + 2
                    ];

                const alpha =
                    imageData.data[
                        index + 3
                    ];

                if (
                    alpha === 0
                ) {

                    continue;
                }

                const gray =
                    0.299 * r +
                    0.587 * g +
                    0.114 * b;

                const char =
                    gray < 128
                        ? "1"
                        : "0";

                ctx.fillStyle =
                    `rgba(${r},${g},${b},${alpha / 255})`;

                ctx.fillText(
                    char,
                    x *
                        CHAR_WIDTH,
                    y *
                        CHAR_HEIGHT
                );
            }
        }

        row =
            end;

        showProgress(
            5 +
            (
                row /
                asciiHeight
            ) * 70
        );

        setInfo(
            `Rendering image: ` +
            `${Math.floor(
                row /
                asciiHeight *
                100
            )}%`
        );

        await nextFrame();
    }

    fitCanvasToScreen();

    /*
     * Encode one-frame GIF.
     */
    const blob =
        await encodeFrames(
            [previewCanvas],
            [1000],
            outputWidth,
            outputHeight,
            token
        );

    return {
        blob,
        width: asciiWidth,
        height: asciiHeight
    };
}


/* =========================================================
   SHOW GIF
   ========================================================= */

function showGeneratedGIF(
    blob
) {

    if (
        currentGifUrl
    ) {

        URL.revokeObjectURL(
            currentGifUrl
        );
    }

    currentGifBlob =
        blob;

    currentGifUrl =
        URL.createObjectURL(
            blob
        );

    gifPreview.src =
        currentGifUrl;

    downloadArea.style.display =
        "block";

    downloadBtn.style.display =
        "inline-block";
}


/* =========================================================
   MAIN PROCESS
   ========================================================= */

async function processImage() {

    renderToken++;

    const token =
        renderToken;

    convertBtn.disabled =
        true;

    stopBtn.style.display =
        "inline-block";

    downloadBtn.style.display =
        "none";

    copyBtn.style.display =
        "none";

    hideError();
    hideWarning();
    hideProgress();

    clearOutput();

    if (
        currentGifUrl
    ) {

        URL.revokeObjectURL(
            currentGifUrl
        );

        currentGifUrl =
            null;
    }

    currentGifBlob =
        null;

    downloadArea.style.display =
        "none";

    try {

        checkLibraries();

        const input =
            await getInputSource();

        if (
            token !== renderToken
        ) {

            return;
        }

        /*
         * Read enough bytes to identify the actual file.
         */
        const buffer =
            await input.blob.arrayBuffer();

        const detectedMime =
            detectMimeFromBytes(
                buffer
            );

        const mime =
            detectedMime ||
            normalizeMime(
                input.mime
            );

        /*
         * GIF gets decoded with gifuct-js.
         */
        if (
            mime === "image/gif"
        ) {

            const result =
                await processGif(
                    input.blob,
                    token
                );

            if (
                token !== renderToken
            ) {

                return;
            }

            showGeneratedGIF(
                result.blob
            );

            fitCanvasToScreen();

            setInfo(
                `Complete — GIF → GIF | ` +
                `${result.sourceWidth} × ` +
                `${result.sourceHeight} source | ` +
                `${result.asciiWidth} × ` +
                `${result.asciiHeight} character cells | ` +
                `${result.frames} frames`
            );

            copyBtn.style.display =
                "inline-block";

            showProgress(100);

            await sleep(300);

            hideProgress();

            return;
        }

        /*
         * WebP:
         *
         * createImageBitmap handles static WebP
         * in browsers that support it.
         *
         * Animated WebP support is intentionally not
         * passed through ImageDecoder anymore.
         */
        if (
            mime === "image/webp"
        ) {

            /*
             * Try normal browser decoding first.
             *
             * This handles static WebP and browsers that
             * expose the animation as a normal bitmap.
             */
            const result =
                await processStatic(
                    input.blob,
                    token
                );

            if (
                token !== renderToken
            ) {

                return;
            }

            showGeneratedGIF(
                result.blob
            );

            setInfo(
                `Complete — WebP → GIF | ` +
                `${result.width} × ` +
                `${result.height} character cells`
            );

            copyBtn.style.display =
                "inline-block";

            showProgress(100);

            await sleep(300);

            hideProgress();

            return;
        }

        /*
         * Normal static image.
         */
        const result =
            await processStatic(
                input.blob,
                token
            );

        if (
            token !== renderToken
        ) {

            return;
        }

        showGeneratedGIF(
            result.blob
        );

        setInfo(
            `Complete — ` +
            `${result.width} × ` +
            `${result.height} character cells`
        );

        copyBtn.style.display =
            "inline-block";

        showProgress(100);

        await sleep(300);

        hideProgress();

    } catch (error) {

        console.error(
            "Conversion error:",
            error
        );

        if (
            token !== renderToken
        ) {

            return;
        }

        showError(
            error?.message ||
            "Something went wrong while processing the image."
        );

        setInfo(
            "Processing failed."
        );

        hideProgress();

    } finally {

        if (
            token === renderToken
        ) {

            convertBtn.disabled =
                false;

            stopBtn.style.display =
                "none";
        }
    }
}


/* =========================================================
   STOP
   ========================================================= */

function stopRendering() {

    renderToken++;

    setInfo(
        "Rendering stopped."
    );

    convertBtn.disabled =
        false;

    stopBtn.style.display =
        "none";

    hideProgress();
}


/* =========================================================
   DOWNLOAD
   ========================================================= */

function downloadGIF() {

    if (
        !currentGifBlob ||
        !currentGifUrl
    ) {

        return;
    }

    const link =
        document.createElement(
            "a"
        );

    link.href =
        currentGifUrl;

    link.download =
        "binary-art.gif";

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();
}


/* =========================================================
   COPY FRAME
   ========================================================= */

async function copyCurrentFrame() {

    if (
        !currentImageData ||
        currentWidth <= 0 ||
        currentHeight <= 0
    ) {

        return;
    }

    const lines = [];

    for (
        let y = 0;
        y < currentHeight;
        y++
    ) {

        let line = "";

        for (
            let x = 0;
            x < currentWidth;
            x++
        ) {

            const index =
                (
                    y *
                    currentWidth +
                    x
                ) * 4;

            const alpha =
                currentImageData.data[
                    index + 3
                ];

            if (
                alpha === 0
            ) {

                line += " ";

                continue;
            }

            const r =
                currentImageData.data[
                    index
                ];

            const g =
                currentImageData.data[
                    index + 1
                ];

            const b =
                currentImageData.data[
                    index + 2
                ];

            const gray =
                0.299 * r +
                0.587 * g +
                0.114 * b;

            line +=
                gray < 128
                    ? "1"
                    : "0";
        }

        lines.push(
            line
        );
    }

    const text =
        lines.join("\n");

    try {

        if (
            navigator.clipboard &&
            navigator.clipboard.writeText
        ) {

            await navigator.clipboard.writeText(
                text
            );

        } else {

            const textarea =
                document.createElement(
                    "textarea"
                );

            textarea.value =
                text;

            textarea.style.position =
                "fixed";

            textarea.style.left =
                "-9999px";

            document.body.appendChild(
                textarea
            );

            textarea.select();

            document.execCommand(
                "copy"
            );

            textarea.remove();
        }

        setInfo(
            "Current frame copied as text."
        );

    } catch (error) {

        showError(
            "Clipboard access failed."
        );
    }
}


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    function() {

        fitCanvasToScreen();

    }
);


/* =========================================================
   EVENTS
   ========================================================= */

convertBtn.addEventListener(
    "click",
    processImage
);


stopBtn.addEventListener(
    "click",
    stopRendering
);


downloadBtn.addEventListener(
    "click",
    downloadGIF
);


copyBtn.addEventListener(
    "click",
    copyCurrentFrame
);


imgUrl.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            processImage();
        }
    }
);


fileInput.addEventListener(
    "change",
    function() {

        if (
            fileInput.files.length
        ) {

            imgUrl.value =
                "";

            setInfo(
                `Selected: ${fileInput.files[0].name}`
            );
        }
    }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

(async function init() {

    try {

        checkLibraries();

        setInfo(
            "Preparing GIF encoder..."
        );

        await prepareGifWorker();

        setInfo(
            "Ready — choose an image, GIF, or WebP."
        );

    } catch (error) {

        console.error(
            error
        );

        showError(
            error.message ||
            "Failed to initialize."
        );

        setInfo(
            "Initialization failed."
        );
    }

})();

</script>
