<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Colored Binary GIF / WebP to GIF</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #121212;
    color: #e0e0e0;
    padding: 20px;
    max-width: 1400px;
    margin: auto;
}

h2 {
    color: #4fc3f7;
    margin-top: 0;
}

.controls {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
}

input[type="text"] {
    flex: 1;
    padding: 10px;
    border-radius: 4px;
    border: 1px solid #333;
    background: #1e1e1e;
    color: white;
    min-width: 280px;
    outline: none;
    font-size: 14px;
}

input[type="text"]:focus {
    border-color: #0288d1;
}

input[type="file"] {
    color: #ddd;
    max-width: 300px;
}

select,
button {
    padding: 10px 15px;
    border-radius: 4px;
    border: none;
    background: #0288d1;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

select {
    min-width: 230px;
}

button:hover {
    background: #0277bd;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

#stopBtn {
    display: none;
    background: #c62828;
}

#stopBtn:hover {
    background: #b71c1c;
}

#downloadBtn {
    display: none;
    background: #2e7d32;
}

#downloadBtn:hover {
    background: #1b5e20;
}

#copyBtn {
    display: none;
    background: #6a1b9a;
}

#info {
    color: #aaa;
    font-size: 13px;
    margin: 8px 0 12px;
    line-height: 1.5;
}

#warning {
    display: none;
    background: #4a3200;
    border: 1px solid #9a6b00;
    color: #ffd666;
    padding: 10px;
    border-radius: 5px;
    margin-bottom: 12px;
    line-height: 1.4;
}

#error {
    display: none;
    background: #4a1010;
    border: 1px solid #a52a2a;
    color: #ffaaaa;
    padding: 10px;
    border-radius: 5px;
    margin-bottom: 12px;
    line-height: 1.4;
}

#progressContainer {
    display: none;
    width: 100%;
    height: 7px;
    background: #222;
    border-radius: 4px;
    margin-bottom: 12px;
    overflow: hidden;
}

#progressBar {
    height: 100%;
    width: 0%;
    background: #03a9f4;
    transition: width .05s linear;
}

#outputWrapper {
    background: #000;
    border: 1px solid #333;
    border-radius: 6px;
    overflow: auto;
    padding: 15px;
    max-width: 100%;
}

#canvasContainer {
    width: 100%;
    overflow: auto;
    background: #000;
}

#previewCanvas {
    display: block;
    background: #000;
    image-rendering: auto;
    max-width: none;
}

#placeholder {
    color: #777;
    font-family: "Courier New", monospace;
    white-space: pre-wrap;
}

#downloadArea {
    margin-top: 15px;
    display: none;
}

#gifPreview {
    max-width: 100%;
    height: auto;
    background: #000;
    border: 1px solid #333;
}

#sourceCanvas,
#frameCanvas {
    display: none;
}

.small {
    color: #888;
    font-size: 12px;
    margin-top: 8px;
}
</style>
</head>

<body>

<h2>Image → Colored 1 / 0 Animated GIF</h2>

<div class="controls">

    <input
        type="text"
        id="imgUrl"
        placeholder="Paste image / GIF / WebP URL..."
    >

    <input
        type="file"
        id="fileInput"
        accept="image/*,.gif,.webp"
    >

    <select id="qualitySelect">

        <option value="35">
            Low — 35 characters wide
        </option>

        <option value="80" selected>
            Medium — 80 characters wide
        </option>

        <option value="150">
            High — 150 characters wide
        </option>

        <option value="300">
            300 characters wide
        </option>

        <option value="500">
            500 characters wide
        </option>

    </select>

    <button id="convertBtn">
        Convert
    </button>

    <button id="stopBtn">
        Stop
    </button>

    <button id="downloadBtn">
        Download GIF
    </button>

    <button id="copyBtn">
        Copy Frame
    </button>

</div>

<div id="info">
    No image loaded.
</div>

<div id="warning"></div>

<div id="error"></div>

<div id="progressContainer">
    <div id="progressBar"></div>
</div>

<div id="outputWrapper">

    <div id="canvasContainer">

        <div id="placeholder">
            Paste an image/GIF/WebP URL or choose a file above.
        </div>

        <canvas id="previewCanvas"></canvas>

    </div>

</div>

<div id="downloadArea">

    <h3>Generated GIF</h3>

    <img id="gifPreview">

    <div class="small">
        The GIF above is the actual generated binary GIF.
    </div>

</div>

<canvas id="sourceCanvas"></canvas>
<canvas id="frameCanvas"></canvas>

<script>
"use strict";

/*
===========================================================
CONFIGURATION
===========================================================
*/

const CHAR_WIDTH = 6;
const CHAR_HEIGHT = 10;
const FONT_SIZE = 10;

/*
 * Maximum character dimensions for animated input.
 *
 * The requested output limit is now 500 x 500 character
 * cells, although normal GIF sizes will usually be much
 * smaller because of browser memory limitations.
 */
const ANIMATED_MAX_WIDTH = 500;
const ANIMATED_MAX_HEIGHT = 500;

const MAX_ANIMATION_FRAMES = 120;

const MAX_OUTPUT_PIXELS = 160000000;

const MIN_DISPLAY_SCALE = 0.20;


/*
===========================================================
ELEMENTS
===========================================================
*/

const imgUrl =
    document.getElementById("imgUrl");

const fileInput =
    document.getElementById("fileInput");

const qualitySelect =
    document.getElementById("qualitySelect");

const convertBtn =
    document.getElementById("convertBtn");

const stopBtn =
    document.getElementById("stopBtn");

const downloadBtn =
    document.getElementById("downloadBtn");

const copyBtn =
    document.getElementById("copyBtn");

const info =
    document.getElementById("info");

const warning =
    document.getElementById("warning");

const errorBox =
    document.getElementById("error");

const progressContainer =
    document.getElementById("progressContainer");

const progressBar =
    document.getElementById("progressBar");

const outputWrapper =
    document.getElementById("outputWrapper");

const previewCanvas =
    document.getElementById("previewCanvas");

const placeholder =
    document.getElementById("placeholder");

const gifPreview =
    document.getElementById("gifPreview");

const downloadArea =
    document.getElementById("downloadArea");

const sourceCanvas =
    document.getElementById("sourceCanvas");

const frameCanvas =
    document.getElementById("frameCanvas");


/*
===========================================================
STATE
===========================================================
*/

let renderToken = 0;

let currentGifBlob = null;
let currentGifUrl = null;

let currentImageData = null;

let currentWidth = 0;
let currentHeight = 0;


/*
===========================================================
HELPERS
===========================================================
*/

function nextFrame() {

    return new Promise(resolve => {

        requestAnimationFrame(resolve);

    });

}


function sleep(ms) {

    return new Promise(resolve => {

        setTimeout(resolve, ms);

    });

}


function clamp(value, min, max) {

    return Math.max(
        min,
        Math.min(max, value)
    );

}


function setInfo(text) {

    info.textContent = text;

}


function showError(text) {

    errorBox.textContent = text;

    errorBox.style.display = "block";

}


function hideError() {

    errorBox.textContent = "";

    errorBox.style.display = "none";

}


function showWarning(text) {

    warning.textContent = text;

    warning.style.display = "block";

}


function hideWarning() {

    warning.textContent = "";

    warning.style.display = "none";

}


function showProgress(percent) {

    progressContainer.style.display =
        "block";

    progressBar.style.width =
        clamp(percent, 0, 100) + "%";

}


function hideProgress() {

    progressContainer.style.display =
        "none";

    progressBar.style.width =
        "0%";

}


function clearOutput() {

    previewCanvas.width = 1;
    previewCanvas.height = 1;

    previewCanvas.style.width = "1px";
    previewCanvas.style.height = "1px";

    placeholder.style.display = "block";

}


/*
===========================================================
FIT PREVIEW
===========================================================
*/

function fitCanvasToScreen() {

    if (
        previewCanvas.width <= 1 ||
        previewCanvas.height <= 1
    ) {
        return;
    }

    const availableWidth =
        Math.max(
            1,
            outputWrapper.clientWidth - 30
        );

    const naturalWidth =
        previewCanvas.width;

    let scale =
        Math.min(
            1,
            availableWidth / naturalWidth
        );

    if (
        scale < MIN_DISPLAY_SCALE
    ) {
        scale = MIN_DISPLAY_SCALE;
    }

    previewCanvas.style.width =
        Math.round(
            naturalWidth * scale
        ) + "px";

    previewCanvas.style.height =
        Math.round(
            previewCanvas.height * scale
        ) + "px";

}


/*
===========================================================
RESOLUTION
===========================================================
*/

function calculateResolution(
    sourceWidth,
    sourceHeight,
    quality,
    animated
) {

    let width;

    if (animated) {

        width =
            Math.min(
                sourceWidth,
                ANIMATED_MAX_WIDTH
            );

    } else {

        width =
            Math.min(
                parseInt(
                    quality,
                    10
                ),
                sourceWidth
            );

    }

    const imageRatio =
        sourceHeight /
        sourceWidth;

    const characterCorrection =
        CHAR_WIDTH /
        CHAR_HEIGHT;

    let height =
        Math.max(
            1,
            Math.round(
                width *
                imageRatio *
                characterCorrection
            )
        );

    if (animated) {

        if (
            height > ANIMATED_MAX_HEIGHT
        ) {

            const scale =
                ANIMATED_MAX_HEIGHT /
                height;

            height =
                ANIMATED_MAX_HEIGHT;

            width =
                Math.max(
                    1,
                    Math.round(
                        width * scale
                    )
                );

        }

    }

    return {
        width,
        height
    };

}


/*
===========================================================
MIME DETECTION
===========================================================
*/

function guessMime(name) {

    const clean =
        name
        .split("?")[0]
        .split("#")[0]
        .toLowerCase();

    if (
        clean.endsWith(".gif")
    ) {
        return "image/gif";
    }

    if (
        clean.endsWith(".webp")
    ) {
        return "image/webp";
    }

    if (
        clean.endsWith(".png")
    ) {
        return "image/png";
    }

    if (
        clean.endsWith(".jpg") ||
        clean.endsWith(".jpeg")
    ) {
        return "image/jpeg";
    }

    return "";
}


/*
===========================================================
LOAD URL
===========================================================
*/

async function getURLData(url) {

    /*
     * First try fetch.
     *
     * This works when the remote server permits CORS.
     */
    try {

        const response =
            await fetch(
                url,
                {
                    mode: "cors"
                }
            );

        if (
            response.ok
        ) {

            const blob =
                await response.blob();

            return {
                blob,
                mime:
                    blob.type ||
                    guessMime(url)
            };

        }

    } catch (err) {

        /*
         * Fall through to <img> loading.
         */

    }


    /*
     * Browser <img> fallback.
     *
     * This is useful for URLs that can be displayed by the
     * browser but cannot be fetched by JavaScript.
     */
    return new Promise(
        (resolve, reject) => {

            const image =
                new Image();

            image.crossOrigin =
                "anonymous";

            image.onload =
                async function () {

                    try {

                        /*
                         * Try drawing it. This verifies that
                         * the image is actually usable.
                         */
                        const canvas =
                            document.createElement(
                                "canvas"
                            );

                        canvas.width =
                            image.naturalWidth;

                        canvas.height =
                            image.naturalHeight;

                        const ctx =
                            canvas.getContext(
                                "2d"
                            );

                        ctx.drawImage(
                            image,
                            0,
                            0
                        );

                        canvas.toBlob(
                            function (blob) {

                                if (!blob) {

                                    reject(
                                        new Error(
                                            "The image could not be read."
                                        )
                                    );

                                    return;
                                }

                                resolve({
                                    blob,
                                    mime:
                                        blob.type ||
                                        guessMime(url)
                                });

                            },
                            "image/png"
                        );

                    } catch (err) {

                        reject(
                            new Error(
                                "The image loaded, but GitHub Pages cannot read its pixels. " +
                                "The remote server must permit CORS."
                            )
                        );

                    }

                };

            image.onerror =
                function () {

                    reject(
                        new Error(
                            "Could not load the image URL. " +
                            "For remote images, the host must allow browser access."
                        )
                    );

                };

            image.src =
                url;

        }
    );

}


/*
===========================================================
INPUT
===========================================================
*/

async function getInputSource() {

    const file =
        fileInput.files[0];

    if (file) {

        return {
            blob: file,
            mime:
                file.type ||
                guessMime(file.name)
        };

    }

    const url =
        imgUrl.value.trim();

    if (!url) {

        throw new Error(
            "Please provide an image URL or choose a file."
        );

    }

    return await getURLData(url);

}


/*
===========================================================
IMAGE → IMAGE DATA
===========================================================
*/

async function loadImageElement(blob) {

    const url =
        URL.createObjectURL(blob);

    try {

        const image =
            new Image();

        image.decoding =
            "async";

        await new Promise(
            (resolve, reject) => {

                image.onload =
                    resolve;

                image.onerror =
                    function () {

                        reject(
                            new Error(
                                "Browser could not decode this image."
                            )
                        );

                    };

                image.src =
                    url;

            }
        );

        return image;

    } finally {

        /*
         * The image keeps its decoded data after loading.
         */
        setTimeout(
            () => URL.revokeObjectURL(url),
            1000
        );

    }

}


/*
===========================================================
READ IMAGE FRAME
===========================================================
*/

function readImageFrame(
    image,
    width,
    height
) {

    frameCanvas.width =
        width;

    frameCanvas.height =
        height;

    const ctx =
        frameCanvas.getContext(
            "2d",
            {
                willReadFrequently: true
            }
        );

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    ctx.drawImage(
        image,
        0,
        0,
        width,
        height
    );

    return ctx.getImageData(
        0,
        0,
        width,
        height
    );

}


/*
===========================================================
BINARY CANVAS RENDER
===========================================================
*/

function renderBinaryFrame(
    imageData,
    asciiWidth,
    asciiHeight,
    token
) {

    const outputWidth =
        asciiWidth *
        CHAR_WIDTH;

    const outputHeight =
        asciiHeight *
        CHAR_HEIGHT;

    previewCanvas.width =
        outputWidth;

    previewCanvas.height =
        outputHeight;

    const ctx =
        previewCanvas.getContext(
            "2d"
        );

    ctx.fillStyle =
        "#000000";

    ctx.fillRect(
        0,
        0,
        outputWidth,
        outputHeight
    );

    ctx.font =
        `${FONT_SIZE}px "Courier New", monospace`;

    ctx.textBaseline =
        "top";

    for (
        let y = 0;
        y < asciiHeight;
        y++
    ) {

        if (
            token !== renderToken
        ) {
            return false;
        }

        for (
            let x = 0;
            x < asciiWidth;
            x++
        ) {

            const index =
                (
                    y *
                    asciiWidth +
                    x
                ) * 4;

            const r =
                imageData.data[index];

            const g =
                imageData.data[index + 1];

            const b =
                imageData.data[index + 2];

            const alpha =
                imageData.data[index + 3];

            /*
             * Only fully transparent pixels are blank.
             */
            if (
                alpha === 0
            ) {
                continue;
            }

            const gray =
                0.299 * r +
                0.587 * g +
                0.114 * b;

            const char =
                gray < 128
                    ? "1"
                    : "0";

            /*
             * Force fully opaque output.
             *
             * This is important for the GIF encoder because
             * partially transparent text can otherwise become
             * invisible after palette conversion.
             */
            ctx.fillStyle =
                `rgb(${r},${g},${b})`;

            ctx.fillText(
                char,
                x * CHAR_WIDTH,
                y * CHAR_HEIGHT
            );

        }

    }

    return true;

}


/*
===========================================================
STATIC IMAGE
===========================================================
*/

async function renderStatic(
    blob,
    token
) {

    const image =
        await loadImageElement(blob);

    if (
        token !== renderToken
    ) {
        return null;
    }

    const sourceWidth =
        image.naturalWidth;

    const sourceHeight =
        image.naturalHeight;

    const resolution =
        calculateResolution(
            sourceWidth,
            sourceHeight,
            qualitySelect.value,
            false
        );

    const asciiWidth =
        resolution.width;

    const asciiHeight =
        resolution.height;

    const outputPixels =
        asciiWidth *
        CHAR_WIDTH *
        asciiHeight *
        CHAR_HEIGHT;

    if (
        outputPixels >
        MAX_OUTPUT_PIXELS
    ) {

        throw new Error(
            "The requested output is too large."
        );

    }

    const imageData =
        readImageFrame(
            image,
            asciiWidth,
            asciiHeight
        );

    currentImageData =
        imageData;

    currentWidth =
        asciiWidth;

    currentHeight =
        asciiHeight;

    placeholder.style.display =
        "none";

    const success =
        renderBinaryFrame(
            imageData,
            asciiWidth,
            asciiHeight,
            token
        );

    if (!success) {
        return null;
    }

    fitCanvasToScreen();

    return {
        width: asciiWidth,
        height: asciiHeight
    };

}


/*
===========================================================
ANIMATED GIF DECODER
===========================================================

No WebCodecs.
No ImageDecoder.
No gif.worker.js.

The browser itself decodes the GIF.

The GIF is placed in an Image element and its rendered
animation is sampled from the browser's compositor.

This is intentionally compatible with static hosting such
as GitHub Pages.
===========================================================
*/

async function decodeAnimatedByPlayback(
    blob,
    token
) {

    const url =
        URL.createObjectURL(blob);

    const image =
        new Image();

    image.decoding =
        "async";

    image.src =
        url;

    await new Promise(
        (resolve, reject) => {

            image.onload =
                resolve;

            image.onerror =
                function () {

                    reject(
                        new Error(
                            "The browser could not decode this GIF."
                        )
                    );

                };

        }
    );

    if (
        token !== renderToken
    ) {

        URL.revokeObjectURL(url);

        throw new Error(
            "Rendering stopped."
        );

    }

    const sourceWidth =
        image.naturalWidth;

    const sourceHeight =
        image.naturalHeight;

    if (
        !sourceWidth ||
        !sourceHeight
    ) {

        URL.revokeObjectURL(url);

        throw new Error(
            "Could not determine the animated image dimensions."
        );

    }

    return {
        image,
        url,
        sourceWidth,
        sourceHeight
    };

}


/*
===========================================================
SAMPLE GIF ANIMATION
===========================================================
*/

async function captureAnimatedGIF(
    image,
    sourceWidth,
    sourceHeight,
    token
) {

    const resolution =
        calculateResolution(
            sourceWidth,
            sourceHeight,
            qualitySelect.value,
            true
        );

    const asciiWidth =
        resolution.width;

    const asciiHeight =
        resolution.height;

    currentWidth =
        asciiWidth;

    currentHeight =
        asciiHeight;

    const frames = [];

    /*
     * Capture at roughly 12 FPS.
     *
     * Browser GIF playback timing varies, so sampling is
     * deliberately conservative.
     */
    const frameDelay =
        83;

    let lastSignature = "";

    let stableFrames = 0;

    /*
     * Give the GIF time to start.
     */
    await sleep(100);

    for (
        let frameIndex = 0;
        frameIndex < MAX_ANIMATION_FRAMES;
        frameIndex++
    ) {

        if (
            token !== renderToken
        ) {

            throw new Error(
                "Rendering stopped."
            );

        }

        /*
         * Read current browser-rendered GIF frame.
         */
        const imageData =
            readImageFrame(
                image,
                asciiWidth,
                asciiHeight
            );

        currentImageData =
            imageData;

        /*
         * Create an independent canvas containing
         * the binary representation.
         */
        const frameCanvasCopy =
            document.createElement(
                "canvas"
            );

        frameCanvasCopy.width =
            asciiWidth *
            CHAR_WIDTH;

        frameCanvasCopy.height =
            asciiHeight *
            CHAR_HEIGHT;

        const frameCtx =
            frameCanvasCopy.getContext(
                "2d"
            );

        frameCtx.fillStyle =
            "#000000";

        frameCtx.fillRect(
            0,
            0,
            frameCanvasCopy.width,
            frameCanvasCopy.height
        );

        frameCtx.font =
            `${FONT_SIZE}px "Courier New", monospace`;

        frameCtx.textBaseline =
            "top";

        for (
            let y = 0;
            y < asciiHeight;
            y++
        ) {

            for (
                let x = 0;
                x < asciiWidth;
                x++
            ) {

                const index =
                    (
                        y *
                        asciiWidth +
                        x
                    ) * 4;

                const r =
                    imageData.data[index];

                const g =
                    imageData.data[index + 1];

                const b =
                    imageData.data[index + 2];

                const alpha =
                    imageData.data[index + 3];

                if (
                    alpha === 0
                ) {
                    continue;
                }

                const gray =
                    0.299 * r +
                    0.587 * g +
                    0.114 * b;

                const char =
                    gray < 128
                        ? "1"
                        : "0";

                frameCtx.fillStyle =
                    `rgb(${r},${g},${b})`;

                frameCtx.fillText(
                    char,
                    x * CHAR_WIDTH,
                    y * CHAR_HEIGHT
                );

            }

        }

        /*
         * Detect whether we are actually seeing animation.
         */
        const sample =
            imageData.data;

        let signature =
            "";

        const step =
            Math.max(
                1,
                Math.floor(
                    sample.length / 100
                )
            );

        for (
            let i = 0;
            i < sample.length;
            i += step
        ) {

            signature +=
                sample[i].toString(16);

        }

        if (
            signature === lastSignature
        ) {

            stableFrames++;

        } else {

            stableFrames = 0;

        }

        lastSignature =
            signature;

        frames.push({
            canvas:
                frameCanvasCopy,
            delay:
                frameDelay
        });

        /*
         * Show preview.
         */
        previewCanvas.width =
            frameCanvasCopy.width;

        previewCanvas.height =
            frameCanvasCopy.height;

        previewCanvas
            .getContext("2d")
            .drawImage(
                frameCanvasCopy,
                0,
                0
            );

        placeholder.style.display =
            "none";

        fitCanvasToScreen();

        showProgress(
            10 +
            (
                frameIndex /
                MAX_ANIMATION_FRAMES
            ) * 55
        );

        setInfo(
            `Capturing GIF animation: ` +
            `${frameIndex + 1} / ${MAX_ANIMATION_FRAMES}`
        );

        /*
         * If the image hasn't changed for many samples,
         * it is probably a static GIF.
         *
         * Don't wait indefinitely.
         */
        if (
            frameIndex >= 12 &&
            stableFrames >= 10
        ) {

            break;

        }

        await sleep(frameDelay);

    }

    return {
        frames,
        width: asciiWidth,
        height: asciiHeight
    };

}


/*
===========================================================
GIF ENCODER
===========================================================

This is a small worker-free GIF89a encoder.

Important:
- No gif.js
- No external worker
- No cross-origin worker
- Works from GitHub Pages
- Uses a fixed 256-color palette
===========================================================
*/

class BinaryGIFEncoder {

    constructor(
        width,
        height,
        loop = 0
    ) {

        this.width =
            width;

        this.height =
            height;

        this.loop =
            loop;

        this.frames =
            [];

    }


    addFrame(
        canvas,
        delay
    ) {

        const ctx =
            canvas.getContext(
                "2d",
                {
                    willReadFrequently: true
                }
            );

        const imageData =
            ctx.getImageData(
                0,
                0,
                this.width,
                this.height
            );

        this.frames.push({
            data:
                new Uint8Array(
                    imageData.data
                ),
            delay:
                Math.max(
                    20,
                    delay || 100
                )
        });

    }


    encode() {

        const out =
            new ByteWriter();

        /*
         * Header.
         */
        out.string(
            "GIF89a"
        );

        /*
         * Logical screen.
         */
        out.u16(
            this.width
        );

        out.u16(
            this.height
        );

        /*
         * Global color table:
         *
         * 256 colors
         * 8-bit color resolution
         * sorted = false
         * table size = 256
         */
        out.u8(
            0xF7
        );

        /*
         * Background color.
         */
        out.u8(0);

        /*
         * Pixel aspect ratio.
         */
        out.u8(0);

        /*
         * Palette.
         */
        const palette =
            createPalette();

        for (
            const color of palette
        ) {

            out.u8(color[0]);
            out.u8(color[1]);
            out.u8(color[2]);

        }

        /*
         * Netscape looping extension.
         */
        out.u8(0x21);
        out.u8(0xFF);
        out.u8(11);

        out.string(
            "NETSCAPE2.0"
        );

        out.u8(3);
        out.u8(1);

        out.u16(
            this.loop
        );

        out.u8(0);

        /*
         * Frames.
         */
        for (
            const frame of this.frames
        ) {

            const indices =
                rgbaToPalette(
                    frame.data
                );

            /*
             * Graphic Control Extension.
             */
            out.u8(0x21);
            out.u8(0xF9);
            out.u8(4);

            /*
             * Disposal method 1.
             */
            out.u8(0x04);

            /*
             * Delay in 1/100 second units.
             */
            out.u16(
                Math.max(
                    2,
                    Math.round(
                        frame.delay / 10
                    )
                )
            );

            /*
             * Transparent color index unused.
             */
            out.u8(0);

            out.u8(0);

            /*
             * Image descriptor.
             */
            out.u8(0x2C);

            out.u16(0);
            out.u16(0);

            out.u16(
                this.width
            );

            out.u16(
                this.height
            );

            /*
             * No local color table.
             */
            out.u8(0);

            /*
             * LZW minimum code size.
             */
            const minCodeSize = 8;

            out.u8(
                minCodeSize
            );

            const compressed =
                lzwEncode(
                    indices,
                    minCodeSize
                );

            let offset = 0;

            while (
                offset <
                compressed.length
            ) {

                const size =
                    Math.min(
                        255,
                        compressed.length -
                        offset
                    );

                out.u8(size);

                for (
                    let i = 0;
                    i < size;
                    i++
                ) {

                    out.u8(
                        compressed[
                            offset + i
                        ]
                    );

                }

                offset += size;

            }

            out.u8(0);

        }

        /*
         * Trailer.
         */
        out.u8(0x3B);

        return new Blob(
            [
                out.finish()
            ],
            {
                type:
                    "image/gif"
            }
        );

    }

}


/*
===========================================================
BYTE WRITER
===========================================================
*/

class ByteWriter {

    constructor() {

        this.bytes = [];

    }

    u8(value) {

        this.bytes.push(
            value & 255
        );

    }

    u16(value) {

        this.u8(
            value & 255
        );

        this.u8(
            (value >> 8) & 255
        );

    }

    string(value) {

        for (
            let i = 0;
            i < value.length;
            i++
        ) {

            this.u8(
                value.charCodeAt(i)
            );

        }

    }

    finish() {

        return new Uint8Array(
            this.bytes
        );

    }

}


/*
===========================================================
256-COLOR PALETTE
===========================================================
*/

function createPalette() {

    const palette = [];

    /*
     * Grayscale colors.
     *
     * The binary characters themselves are colored using
     * the source image, but the GIF must have a finite
     * palette.
     *
     * Build a practical RGB cube:
     * 6 x 6 x 6 = 216 colors
     * plus grayscale.
     */

    for (
        let r = 0;
        r < 6;
        r++
    ) {

        for (
            let g = 0;
            g < 6;
            g++
        ) {

            for (
                let b = 0;
                b < 6;
                b++
            ) {

                palette.push([
                    Math.round(
                        r * 255 / 5
                    ),
                    Math.round(
                        g * 255 / 5
                    ),
                    Math.round(
                        b * 255 / 5
                    )
                ]);

            }

        }

    }

    /*
     * Remaining 40 entries.
     */
    for (
        let i = 0;
        i < 40;
        i++
    ) {

        const v =
            Math.round(
                i * 255 / 39
            );

        palette.push([
            v,
            v,
            v
        ]);

    }

    while (
        palette.length < 256
    ) {

        palette.push([
            0,
            0,
            0
        ]);

    }

    return palette;

}


/*
===========================================================
RGB → PALETTE
===========================================================
*/

function nearestPaletteIndex(
    r,
    g,
    b
) {

    /*
     * First 216 colors are RGB cube.
     */
    const rr =
        Math.round(
            r / 51
        );

    const gg =
        Math.round(
            g / 51
        );

    const bb =
        Math.round(
            b / 51
        );

    const cr =
        clamp(
            rr,
            0,
            5
        );

    const cg =
        clamp(
            gg,
            0,
            5
        );

    const cb =
        clamp(
            bb,
            0,
            5
        );

    return (
        cr * 36 +
        cg * 6 +
        cb
    );

}


function rgbaToPalette(data) {

    const result =
        new Uint8Array(
            data.length / 4
        );

    let p = 0;

    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const r =
            data[i];

        const g =
            data[i + 1];

        const b =
            data[i + 2];

        result[p++] =
            nearestPaletteIndex(
                r,
                g,
                b
            );

    }

    return result;

}


/*
===========================================================
LZW ENCODER
===========================================================
*/

function lzwEncode(
    indices,
    minCodeSize
) {

    const clearCode =
        1 << minCodeSize;

    const endCode =
        clearCode + 1;

    let nextCode =
        endCode + 1;

    let codeSize =
        minCodeSize + 1;

    const maxCode =
        1 << 12;

    const dictionary =
        new Map();

    const output = [];

    let bitBuffer = 0;
    let bitCount = 0;

    function writeCode(code) {

        bitBuffer |=
            code << bitCount;

        bitCount +=
            codeSize;

        while (
            bitCount >= 8
        ) {

            output.push(
                bitBuffer & 255
            );

            bitBuffer >>=
                8;

            bitCount -=
                8;

        }

    }

    function resetDictionary() {

        dictionary.clear();

        nextCode =
            endCode + 1;

        codeSize =
            minCodeSize + 1;

    }

    writeCode(
        clearCode
    );

    resetDictionary();

    if (
        indices.length === 0
    ) {

        writeCode(
            endCode
        );

        if (
            bitCount > 0
        ) {

            output.push(
                bitBuffer & 255
            );

        }

        return new Uint8Array(
            output
        );

    }

    let prefix =
        indices[0];

    for (
        let i = 1;
        i < indices.length;
        i++
    ) {

        const k =
            indices[i];

        const key =
            prefix + "," + k;

        if (
            dictionary.has(key)
        ) {

            prefix =
                dictionary.get(key);

            continue;

        }

        writeCode(
            prefix
        );

        if (
            nextCode <
            maxCode
        ) {

            dictionary.set(
                key,
                nextCode++
            );

            if (
                nextCode >=
                (1 << codeSize) &&
                codeSize < 12
            ) {

                codeSize++;

            }

        } else {

            writeCode(
                clearCode
            );

            resetDictionary();

        }

        prefix =
            k;

    }

    writeCode(
        prefix
    );

    writeCode(
        endCode
    );

    if (
        bitCount > 0
    ) {

        output.push(
            bitBuffer & 255
        );

    }

    return new Uint8Array(
        output
    );

}


/*
===========================================================
ENCODE CANVASES
===========================================================
*/

function encodeFrames(
    frames,
    width,
    height,
    token
) {

    return new Promise(
        async (resolve, reject) => {

            try {

                const encoder =
                    new BinaryGIFEncoder(
                        width,
                        height,
                        0
                    );

                for (
                    let i = 0;
                    i < frames.length;
                    i++
                ) {

                    if (
                        token !== renderToken
                    ) {

                        throw new Error(
                            "Rendering stopped."
                        );

                    }

                    encoder.addFrame(
                        frames[i].canvas,
                        frames[i].delay
                    );

                    showProgress(
                        70 +
                        (
                            (i + 1) /
                            frames.length
                        ) * 30
                    );

                    setInfo(
                        `Encoding GIF: ` +
                        `${i + 1} / ${frames.length}`
                    );

                    await nextFrame();

                }

                resolve(
                    encoder.encode()
                );

            } catch (err) {

                reject(err);

            }

        }
    );

}


/*
===========================================================
STATIC GIF ENCODING
===========================================================
*/

async function encodeStaticGIF(
    token
) {

    const encoder =
        new BinaryGIFEncoder(
            previewCanvas.width,
            previewCanvas.height,
            0
        );

    encoder.addFrame(
        previewCanvas,
        1000
    );

    if (
        token !== renderToken
    ) {

        throw new Error(
            "Rendering stopped."
        );

    }

    return encoder.encode();

}


/*
===========================================================
SHOW GIF
===========================================================
*/

function showGeneratedGIF(
    blob
) {

    if (
        currentGifUrl
    ) {

        URL.revokeObjectURL(
            currentGifUrl
        );

    }

    currentGifBlob =
        blob;

    currentGifUrl =
        URL.createObjectURL(
            blob
        );

    gifPreview.src =
        currentGifUrl;

    downloadArea.style.display =
        "block";

    downloadBtn.style.display =
        "inline-block";

}


/*
===========================================================
MAIN PROCESS
===========================================================
*/

async function processImage() {

    renderToken++;

    const token =
        renderToken;

    convertBtn.disabled =
        true;

    stopBtn.style.display =
        "inline-block";

    downloadBtn.style.display =
        "none";

    copyBtn.style.display =
        "none";

    hideError();
    hideWarning();
    hideProgress();

    if (
        currentGifUrl
    ) {

        URL.revokeObjectURL(
            currentGifUrl
        );

        currentGifUrl =
            null;

    }

    currentGifBlob =
        null;

    downloadArea.style.display =
        "none";

    clearOutput();

    try {

        setInfo(
            "Loading image..."
        );

        const input =
            await getInputSource();

        if (
            token !== renderToken
        ) {
            return;
        }

        let mime =
            (
                input.mime ||
                input.blob.type ||
                ""
            ).toLowerCase();

        /*
         * Detect GIF from file name when MIME is missing.
         */
        if (
            !mime &&
            fileInput.files[0]
        ) {

            mime =
                guessMime(
                    fileInput.files[0].name
                );

        }

        const isGIF =
            mime === "image/gif";

        const isWebP =
            mime === "image/webp";

        /*
         * GIF:
         *
         * Browser playback capture.
         */
        if (
            isGIF
        ) {

            setInfo(
                "Loading GIF with browser decoder..."
            );

            const decoded =
                await decodeAnimatedByPlayback(
                    input.blob,
                    token
                );

            if (
                token !== renderToken
            ) {
                return;
            }

            setInfo(
                `GIF detected: ` +
                `${decoded.sourceWidth} × ` +
                `${decoded.sourceHeight}`
            );

            const captured =
                await captureAnimatedGIF(
                    decoded.image,
                    decoded.sourceWidth,
                    decoded.sourceHeight,
                    token
                );

            URL.revokeObjectURL(
                decoded.url
            );

            if (
                !captured.frames.length
            ) {

                throw new Error(
                    "The GIF did not produce any frames."
                );

            }

            setInfo(
                "Encoding final GIF..."
            );

            showProgress(70);

            const blob =
                await encodeFrames(
                    captured.frames,
                    captured.width *
                        CHAR_WIDTH,
                    captured.height *
                        CHAR_HEIGHT,
                    token
                );

            if (
                token !== renderToken
            ) {
                return;
            }

            showGeneratedGIF(
                blob
            );

            copyBtn.style.display =
                "inline-block";

            setInfo(
                `Complete — GIF → binary GIF | ` +
                `${captured.width} × ` +
                `${captured.height} character cells | ` +
                `${captured.frames.length} frames`
            );

            showProgress(100);

            await sleep(300);

            hideProgress();

            return;
        }


        /*
         * WebP:
         *
         * Browser compatibility depends on whether the
         * browser exposes animation through HTMLImageElement.
         *
         * If it is animated, playback capture is attempted.
         * Otherwise it becomes a static image.
         */
        if (
            isWebP
        ) {

            setInfo(
                "Loading WebP with browser decoder..."
            );

            const decoded =
                await decodeAnimatedByPlayback(
                    input.blob,
                    token
                );

            if (
                token !== renderToken
            ) {
                return;
            }

            /*
             * Capture a short sequence. Static WebP will
             * naturally collapse to a few identical frames.
             */
            const captured =
                await captureAnimatedGIF(
                    decoded.image,
                    decoded.sourceWidth,
                    decoded.sourceHeight,
                    token
                );

            URL.revokeObjectURL(
                decoded.url
            );

            /*
             * If only one meaningful frame exists, treat it
             * as static.
             */
            if (
                captured.frames.length <= 1
            ) {

                const result =
                    await renderStatic(
                        input.blob,
                        token
                    );

                if (
                    !result
                ) {
                    return;
                }

                const blob =
                    await encodeStaticGIF(
                        token
                    );

                showGeneratedGIF(
                    blob
                );

                copyBtn.style.display =
                    "inline-block";

                setInfo(
                    `Complete — WebP → GIF | ` +
                    `${result.width} × ` +
                    `${result.height} character cells`
                );

                showProgress(100);

                await sleep(300);

                hideProgress();

                return;
            }

            setInfo(
                "Encoding WebP animation..."
            );

            const blob =
                await encodeFrames(
                    captured.frames,
                    captured.width *
                        CHAR_WIDTH,
                    captured.height *
                        CHAR_HEIGHT,
                    token
                );

            showGeneratedGIF(
                blob
            );

            copyBtn.style.display =
                "inline-block";

            setInfo(
                `Complete — animated WebP → GIF | ` +
                `${captured.width} × ` +
                `${captured.height} character cells | ` +
                `${captured.frames.length} frames`
            );

            showProgress(100);

            await sleep(300);

            hideProgress();

            return;

        }


        /*
         * Static image.
         */
        const result =
            await renderStatic(
                input.blob,
                token
            );

        if (
            !result
        ) {
            return;
        }

        setInfo(
            "Encoding final GIF..."
        );

        showProgress(70);

        const blob =
            await encodeStaticGIF(
                token
            );

        if (
            token !== renderToken
        ) {
            return;
        }

        showGeneratedGIF(
            blob
        );

        copyBtn.style.display =
            "inline-block";

        setInfo(
            `Complete — ` +
            `${result.width} × ` +
            `${result.height} character cells`
        );

        showProgress(100);

        await sleep(300);

        hideProgress();

    } catch (err) {

        console.error(
            "Binary GIF conversion error:",
            err
        );

        if (
            token !== renderToken
        ) {
            return;
        }

        showError(
            err &&
            err.message
                ? err.message
                : "Something went wrong while processing the image."
        );

        setInfo(
            "Processing failed."
        );

        hideProgress();

    } finally {

        if (
            token === renderToken
        ) {

            convertBtn.disabled =
                false;

            stopBtn.style.display =
                "none";

        }

    }

}


/*
===========================================================
STOP
===========================================================
*/

function stopRendering() {

    renderToken++;

    setInfo(
        "Rendering stopped."
    );

    convertBtn.disabled =
        false;

    stopBtn.style.display =
        "none";

    hideProgress();

}


/*
===========================================================
DOWNLOAD
===========================================================
*/

function downloadGIF() {

    if (
        !currentGifBlob ||
        !currentGifUrl
    ) {
        return;
    }

    const a =
        document.createElement(
            "a"
        );

    a.href =
        currentGifUrl;

    a.download =
        "binary-art.gif";

    document.body.appendChild(a);

    a.click();

    a.remove();

}


/*
===========================================================
COPY CURRENT FRAME
===========================================================
*/

async function copyCurrentFrame() {

    if (
        !currentImageData ||
        currentWidth <= 0 ||
        currentHeight <= 0
    ) {
        return;
    }

    const lines = [];

    for (
        let y = 0;
        y < currentHeight;
        y++
    ) {

        let line = "";

        for (
            let x = 0;
            x < currentWidth;
            x++
        ) {

            const index =
                (
                    y *
                    currentWidth +
                    x
                ) * 4;

            const alpha =
                currentImageData.data[
                    index + 3
                ];

            if (
                alpha === 0
            ) {

                line += " ";

                continue;

            }

            const r =
                currentImageData.data[
                    index
                ];

            const g =
                currentImageData.data[
                    index + 1
                ];

            const b =
                currentImageData.data[
                    index + 2
                ];

            const gray =
                0.299 * r +
                0.587 * g +
                0.114 * b;

            line +=
                gray < 128
                    ? "1"
                    : "0";

        }

        lines.push(line);

    }

    try {

        await navigator.clipboard.writeText(
            lines.join("\n")
        );

        setInfo(
            "Current frame copied as text."
        );

    } catch (err) {

        alert(
            "Clipboard access failed."
        );

    }

}


/*
===========================================================
EVENTS
===========================================================
*/

window.addEventListener(
    "resize",
    fitCanvasToScreen
);

convertBtn.addEventListener(
    "click",
    processImage
);

stopBtn.addEventListener(
    "click",
    stopRendering
);

downloadBtn.addEventListener(
    "click",
    downloadGIF
);

copyBtn.addEventListener(
    "click",
    copyCurrentFrame
);

imgUrl.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            processImage();

        }

    }
);

fileInput.addEventListener(
    "change",
    function() {

        if (
            fileInput.files.length
        ) {

            imgUrl.value = "";

            setInfo(
                `Selected: ${
                    fileInput.files[0].name
                }`
            );

        }

    }
);


/*
===========================================================
INITIAL STATE
===========================================================
*/

clearOutput();

</script>
